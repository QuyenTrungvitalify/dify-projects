# Pre-commit hooks for dify-projects.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run on demand:
#   pre-commit run --all-files
#
# Hooks run only on relevant files (filtered via `files:` regex):
#   1. YAML lint (light)               — all *.yml
#   2. Pattern + project schema check  — templates/{patterns,probes,library}/*.yml + projects/*/workflows/*.yml
#   3. validate_workflow.py            — same files (deeper structural check)
#   4. Python compile                  — all .py committed
#
# To skip in an emergency: git commit --no-verify (but please don't)

# Global exclude (spec 009 Lát 5): the builder app (apps/) is a TS/Node sub-project with its own
# toolchain — keep the repo's Python/Dify-DSL hooks off its package.json / tsconfig / dist / .runs.
# Additive: per-hook `exclude:` regexes below still apply on top of this.
exclude: ^(apps/|node_modules/)

repos:
  # --- 1. Built-in basic hooks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(corpus/|skills/|tests/__snapshots__/)
      - id: end-of-file-fixer
        exclude: ^(corpus/|skills/|tests/__snapshots__/|.*\.json$)
      - id: check-yaml
        # Default check-yaml fails on multi-doc YAML and inline {} in Dify DSL.
        # We use a permissive parser here, real schema check in next hook.
        args: [--allow-multiple-documents, --unsafe]
        exclude: ^(corpus/|skills/)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^(schemas/dify-dsl-.*\.json|corpus/)

  # --- 2. YAML lint (light) ---
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        args:
          - -d
          - "{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable, comments-indentation: disable, indentation: disable}}"
        files: ^(templates/|projects/.*/workflows/|projects/.*/\.dify-workspace\.yaml).*\.ya?ml$

  # --- 3. JSON Schema validation (Dify DSL) ---
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.34.0
    hooks:
      - id: check-jsonschema
        name: check-jsonschema (Dify DSL v0.6.0)
        files: ^(templates/(patterns|probes|library)/.*\.ya?ml|projects/.*/workflows/.*\.ya?ml)$
        args:
          - --schemafile
          - schemas/dify-dsl-0.6.0.json

  # --- 4. Local hooks (skill validator + Python compile) ---
  - repo: local
    hooks:
      - id: dify-skill-validate
        name: validate_workflow.py (structural)
        # Vendored canonical validator (spec 026) — tracked in-repo so the gate is durable across a
        # fresh setup.sh clone (the skill clone is gitignored & not guaranteed to carry our checks).
        entry: scripts/py.sh tools/dify_base/validate_workflow.py
        language: system
        files: ^(templates/(patterns|probes|library)/.*\.ya?ml|projects/.*/workflows/.*\.ya?ml)$
        require_serial: false

      - id: dify-dsl-version-guard
        name: DSL version pinned to schema
        # Quick guard: every Dify workflow yml should have `version: 0.6.0`
        # matching the committed schema. Catches accidental version drift.
        entry: scripts/check_dsl_version.sh
        language: script
        files: ^(templates/(patterns|probes|library)/.*\.ya?ml|projects/.*/workflows/.*\.ya?ml)$

      - id: agents-md-refs
        name: AGENTS.md references valid
        # Drift guard: every file path mentioned in AGENTS.md must still exist.
        # Catches the common case where AGENTS.md points at a renamed/deleted file.
        entry: scripts/check_agents_refs.sh
        language: script
        files: ^(AGENTS\.md|scripts/check_agents_refs\.sh)$
        pass_filenames: false

      - id: dify-lint-refs
        name: variable reference linter
        # Cross-check {{#X.Y#}} refs + value_selector arrays against node outputs.
        # Catches Dify import error class #1 (typo in node id / field name).
        entry: scripts/py.sh tools/dify_base/lint_refs.py
        language: system
        files: ^(templates/(patterns|probes|library)/.*\.ya?ml|projects/.*/workflows/.*\.ya?ml)$
        require_serial: false

      - id: dify-lint-node-bodies
        name: node-body schema linter
        # Validate each node's `data` block against its generated NodeData_* schema (spec 038;
        # promoted after the measured 0-FP report docs/specs/038-fp-report.md). Catches wrong-shaped
        # bodies (missing required fields, scalar-where-object) that only surfaced at Dify runtime.
        entry: scripts/py.sh tools/dify_base/lint_node_bodies.py
        language: system
        files: ^(templates/(patterns|probes|library)/.*\.ya?ml|projects/.*/workflows/.*\.ya?ml)$
        require_serial: false

      - id: dify-lint-plugin-hashes
        name: plugin hash format
        # Validates marketplace_plugin_unique_identifier matches
        # <provider>/<plugin>:<semver>@<sha256> (sub-spec 005.1).
        entry: scripts/py.sh tools/dify_base/lint_plugin_hashes.py
        language: system
        files: ^(templates/(patterns|probes|library)/.*\.ya?ml|projects/.*/workflows/.*\.ya?ml)$
        require_serial: false
