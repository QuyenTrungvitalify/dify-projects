# REFERENCE — error_strategy: fail-branch, the minimal worked example (spec 085 S1c).
#
# WHAT THIS IS: the lint-clean shape for fail-soft error branches, the one thing no pattern in
#   templates/patterns/ demonstrates. Phase ③ (implement.md step 4) points here BY PATH when SPEC.md
#   asks for an error branch on `code` / `http-request` nodes. Copy the SHAPES, not the file.
#
# WHY IT LIVES HERE and not in templates/patterns/: gapReferences picks references greedily by
#   "most gap covered → fewest nodes", so a 6-node didactic file placed there would hijack the
#   `http-request`/`code` reference slot from richer real patterns. This file is reachable only by
#   the explicit pointer in implement.md — exactly the "hand it, don't search" contract.
#
# THE SHAPES DEMONSTRATED (grammar: skills/mango-svip/references/edge_types.md,
#   section "Error Handling Nodes"):
#   1. `error_strategy: fail-branch` sits INSIDE `data:` of a code / http-request node.
#   2. A node with fail-branch gets TWO outgoing edges; their `sourceHandle` values are
#      `success-branch` and `fail-branch` (NOT `source`), and the edge id embeds the handle:
#      `<source_id>-success-branch-<target_id>-target`.
#      BOTH edges must reach a terminal node. A fail-branch that dead-ends returns the operator
#      nothing on failure — not even the work already completed before the failing step — which
#      defeats the whole point of choosing fail-branch over letting the run die.
#   3. The failing node implicitly exposes `error_message` + `error_type` — downstream nodes read
#      them like any output: `{{#<node_id>.error_message#}}` / value_selector [<node_id>, error_message].
#   4. Several fail-branches may CONVERGE on one handler (both fail edges below target the same
#      template-transform); at runtime only the branch that fired carries values, the other reads empty.
#   5. `error_strategy: default-value` — the OTHER strategy (node '1754000000007'). No branch edges:
#      the node keeps ONE `source` edge and, on failure, emits the canned `default_value` outputs so
#      the flow continues straight through. Use it when the downstream shape matters more than the
#      failure; use fail-branch when the operator must be TOLD.
#   6. `default_value` rows must mirror the node's OUTPUT contract exactly. For `http-request` that is
#      three rows and only three — `body` (string), `status_code` (number), `headers` (object) — the
#      same list Dify's own editor writes (web/…/error-handle/utils.ts, `getDefaultValue`). For `llm`
#      it is one `text` row; for `code`, one row per declared output.
#
# GOTCHA — THE ONE THAT BREAKS THE EDITOR, NOT THE RUN. In a `default_value` row whose `type` is
#   `object` or any `array[...]`, the `value` MUST be a JSON **string** — `'{}'`, not `{}`; `'[]'`,
#   not `[]`. Both forms import and RUN fine (the backend json.loads a string, entities.py
#   `DefaultValue.validate_value_type`), so every linter and a green Test Run will tell you it is
#   correct. But the editor feeds that value straight to Monaco, which requires a string:
#   `createTextBuffer` falls through to `factory.create(...)` on a non-string and throws
#   `TypeError: $.create is not a function` — the node panel goes blank the moment you CLICK the node.
#   Observed on Dify 1.15 (2026-08-13): 9 http-request nodes, all import-clean and Test-Run-green,
#   all with an unopenable panel until the `{}` was quoted.
#
# GOTCHA — `timeout:` keys. Write `connect` / `read` / `write`. The `max_connect_timeout` /
#   `max_read_timeout` / `max_write_timeout` spelling appears in exported DSL of a NEVER-CONFIGURED
#   node (Dify's own `default.ts` seeds them at 0) and is purely the UI's slider CAP — the backend
#   model `HttpRequestNodeTimeout` has no such fields and silently drops them. A node carrying only
#   `max_*` therefore has NO timeout set: it falls back to connect=10 / read=600 / write=600, so a
#   hung receiver stalls the run for TEN MINUTES instead of the seconds you wrote.
#
# IDS: the 13-digit ids below are PLACEHOLDERS in the real format. In a build, mint your own via
#   `.venv/bin/python skills/mango-svip/scripts/generate_id.py <count>` — never copy ids from any
#   file, this one included (implement.md step 3).
#
# Flow: start(page_url) → HTTP GET (fail-branch)
#         ├─ success → code: strict parse (fail-branch)
#         │             ├─ success → end (summary)
#         │             └─ fail ────┐
#         └─ fail ──────────────────┴→ template-transform: human-readable notice → end (error_notice)
#       start(page_url) → HTTP HEAD (default-value) → end (probe_status)   ← shape 5, parallel probe
app:
  description: 'Reference shape: fail-soft fetch → parse with error branches converging on one notice'
  icon: 🛟
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: reference_error_strategy
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    # Plain edge out of start: sourceHandle stays `source`.
    - id: 1754000000001-source-1754000000002-target
      source: '1754000000001'
      target: '1754000000002'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: start, targetType: http-request }
      zIndex: 0
    # SHAPE 2 — the two branch edges of the http-request node. The handle replaces `source` in both
    # the `sourceHandle` field AND the edge id.
    - id: 1754000000002-success-branch-1754000000003-target
      source: '1754000000002'
      target: '1754000000003'
      sourceHandle: success-branch
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: http-request, targetType: code }
      zIndex: 0
    - id: 1754000000002-fail-branch-1754000000004-target
      source: '1754000000002'
      target: '1754000000004'
      sourceHandle: fail-branch
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: http-request, targetType: template-transform }
      zIndex: 0
    # Same pair for the code node; its fail edge CONVERGES on the same handler (shape 4).
    - id: 1754000000003-success-branch-1754000000005-target
      source: '1754000000003'
      target: '1754000000005'
      sourceHandle: success-branch
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: code, targetType: end }
      zIndex: 0
    - id: 1754000000003-fail-branch-1754000000004-target
      source: '1754000000003'
      target: '1754000000004'
      sourceHandle: fail-branch
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: code, targetType: template-transform }
      zIndex: 0
    - id: 1754000000004-source-1754000000006-target
      source: '1754000000004'
      target: '1754000000006'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: template-transform, targetType: end }
      zIndex: 0
    # SHAPE 5 — a `default-value` node branches NOTHING: one plain `source` edge in, one out. Compare
    # with the two-edge pair above; that difference is the whole choice between the strategies.
    - id: 1754000000001-source-1754000000007-target
      source: '1754000000001'
      target: '1754000000007'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: start, targetType: http-request }
      zIndex: 0
    - id: 1754000000007-source-1754000000008-target
      source: '1754000000007'
      target: '1754000000008'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: http-request, targetType: end }
      zIndex: 0
    nodes:
    - id: '1754000000001'
      type: custom
      data:
        title: Input
        type: start
        variables:
        - variable: page_url
          label: Page URL
          type: text-input
          required: true
          max_length: 2000
          hint: ''
          options: []
          placeholder: 'https://…'
      position: { x: 100, y: 200 }
      positionAbsolute: { x: 100, y: 200 }
      width: 242
      height: 100
      sourcePosition: right
      targetPosition: left
    # SHAPE 1 — `error_strategy: fail-branch` inside data:. A 4xx/5xx/timeout no longer kills the
    # run; it fires the fail-branch edge instead.
    - id: '1754000000002'
      type: custom
      data:
        title: fetch page
        type: http-request
        error_strategy: fail-branch
        method: get
        url: '{{#1754000000001.page_url#}}'
        authorization: { type: no-auth }
        headers: ''
        params: ''
        body: { type: none, data: [] }
        timeout: { connect: 10, read: 30, write: 10 }
        ssl_verify: true
      position: { x: 400, y: 200 }
      positionAbsolute: { x: 400, y: 200 }
      width: 242
      height: 120
      sourcePosition: right
      targetPosition: left
    # A fail-branch node MAY raise — that IS the branch condition. Keep the raise deliberate
    # (here: empty body), not accidental.
    - id: '1754000000003'
      type: custom
      data:
        title: strict parse
        type: code
        error_strategy: fail-branch
        code_language: python3
        code: |
          def main(raw: str) -> dict:
              if not raw or not raw.strip():
                  raise ValueError("empty response body")
              return {"summary": raw.strip()[:200]}
        outputs:
          summary: { type: string, children: null }
        variables:
        - value_selector: ['1754000000002', body]
          value_type: string
          variable: raw
      position: { x: 700, y: 120 }
      positionAbsolute: { x: 700, y: 120 }
      width: 242
      height: 120
      sourcePosition: right
      targetPosition: left
    # SHAPE 3 — downstream reads of the implicit error outputs. Only the branch that actually
    # fired carries values at runtime; the other pair renders empty (shape 4).
    - id: '1754000000004'
      type: custom
      data:
        title: error notice
        type: template-transform
        template: |-
          {% if http_error_message %}Fetch failed [{{ http_error_type }}]: {{ http_error_message }}{% else %}Parse failed [{{ code_error_type }}]: {{ code_error_message }}{% endif %}
        variables:
        - variable: http_error_message
          value_selector: ['1754000000002', error_message]
        - variable: http_error_type
          value_selector: ['1754000000002', error_type]
        - variable: code_error_message
          value_selector: ['1754000000003', error_message]
        - variable: code_error_type
          value_selector: ['1754000000003', error_type]
      position: { x: 700, y: 320 }
      positionAbsolute: { x: 700, y: 320 }
      width: 242
      height: 120
      sourcePosition: right
      targetPosition: left
    - id: '1754000000005'
      type: custom
      data:
        title: Output
        type: end
        outputs:
        - variable: summary
          value_selector: ['1754000000003', summary]
          value_type: string
      position: { x: 1000, y: 120 }
      positionAbsolute: { x: 1000, y: 120 }
      width: 241
      height: 100
      sourcePosition: right
      targetPosition: left
    - id: '1754000000006'
      type: custom
      data:
        title: Error output
        type: end
        outputs:
        - variable: error_notice
          value_selector: ['1754000000004', output]
          value_type: string
      position: { x: 1000, y: 320 }
      positionAbsolute: { x: 1000, y: 320 }
      width: 241
      height: 100
      sourcePosition: right
      targetPosition: left
    # SHAPE 5 + 6 — `error_strategy: default-value`. On failure this node does NOT branch; it emits
    # the three rows below and the run walks straight on, so `{{#1754000000007.status_code#}}` is
    # readable downstream whether the request succeeded or died.
    #   `default_value` MUST list exactly the node's outputs — for http-request: body / status_code /
    #   headers, no more (a `files` row, for instance, is not part of the contract and the editor has
    #   no widget for it). And note `value: '{}'` is QUOTED: an object/array default is a JSON STRING.
    #   Unquoted `{}` imports clean, lints clean, runs clean — and then blanks the node panel on click.
    #   See the GOTCHA in this file's header for the exact mechanism.
    - id: '1754000000007'
      type: custom
      data:
        title: probe endpoint
        type: http-request
        error_strategy: default-value
        default_value:
        - { key: body, type: string, value: '' }
        - { key: status_code, type: number, value: 0 }
        - { key: headers, type: object, value: '{}' }
        method: head
        url: '{{#1754000000001.page_url#}}'
        authorization: { type: no-auth }
        headers: ''
        params: ''
        body: { type: none, data: [] }
        timeout: { connect: 10, read: 30, write: 10 }
        ssl_verify: true
      position: { x: 400, y: 460 }
      positionAbsolute: { x: 400, y: 460 }
      width: 242
      height: 120
      sourcePosition: right
      targetPosition: left
    - id: '1754000000008'
      type: custom
      data:
        title: Probe output
        type: end
        outputs:
        - variable: probe_status
          value_selector: ['1754000000007', status_code]
          value_type: number
      position: { x: 1000, y: 460 }
      positionAbsolute: { x: 1000, y: 460 }
      width: 241
      height: 100
      sourcePosition: right
      targetPosition: left
