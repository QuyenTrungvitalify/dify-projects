# e2e-suite.yml — regression prompts the Builder is expected to handle (spec 058).
#
# Each entry drives ONE simulated user build. `expect` predicates are evaluated mechanically by
# e2e_check.py into three buckets: AUTO-PASS / AUTO-FAIL / MANUAL. `manual:` items are things the
# harness KNOWS it cannot auto-verify (runtime behavior, UI rendering, trigger enablement) — they
# are echoed as MANUAL after every run and reported to the user, never silently dropped.
#
# Vocabulary (kept tiny on purpose — YAGNI):
#   analyze:  { features_include: [..], features_exclude: [..], pattern: <name> }
#   workflow: { grep_present: [..], grep_absent: [..] }     # raw substring over main.yml
#   report:   { notes_include: [..] }                        # report.json.notes is ONE string
#   manual:   [ "<free-text item to verify by hand>", ... ]
# Fire parameters (read by `fire --entry <id>`): prompt, mode (auto|each_step), fast, deploy, project.
# deploy defaults to `none` (no app created in the user's Dify). TRIGGER_ENTRY_NOTE only reaches
# report.notes on selfhost/cloud (report.ts:198), so with deploy:none the note check lives in manual:.

- id: trigger-schedule
  prompt: >-
    毎朝9時に https://jsonplaceholder.typicode.com/todos?userId=1 のJSONを取得して、
    completed が false のタスクの件数とタイトルを日本語で3行以内にまとめ、
    その結果を https://httpbin.org/post へPOSTしてください。
  mode: auto
  deploy: none
  expect:
    analyze:
      features_include: [trigger]
      pattern: scheduled-fetch-notify
    workflow:
      grep_present: ["type: trigger-schedule", "timezone: Asia/Tokyo"]
      grep_absent: ["type: start"]
    report:
      # NOT "all linters passed" — spec 066 S5 retired that line as jargon ("linter" → 「リンター」) and
      # report.ts now emits this plain sentence. The old expectation would AUTO-FAIL every green run.
      notes_include: ["passed every automated check"]
  cost:                      # spec 060 — gross-regression guard (generous; real ③≈20 turns, cache≈98%)
    implement_turns_max: 40  # AUTO-FAIL if the ③ lint→fix loop churns way past its ~20-turn norm
    total_turns_max: 90
    cache_min_pct: 50        # AUTO-FAIL if prompt-caching stops hitting (cold-start regression)
  manual:
    - "Enable the trigger in Dify Studio → Quick Settings and confirm the 9:00 JST fire (S5 deferred — no enable API)"
    - "UI: the JA trigger-entry note renders on the ④ test card (NOTE_JA frame in i18n.ts)"
    - "Runtime: with model filled + imported, the LLM summary is Japanese and ≤3 lines"

- id: negative-no-trigger
  prompt: 入力されたテキストを3行に要約するワークフローを作ってください。
  mode: auto
  deploy: none
  expect:
    analyze:
      features_exclude: [trigger]
    workflow:
      grep_present: ["type: start"]
      grep_absent: ["type: trigger-schedule"]
  manual:
    - "Runtime: paste a paragraph, confirm the summary is 3 lines"

- id: trigger-per-row-chatwork
  # The build that exposed the {{REFERENCES}} gap. It needs TWO shapes at once — the approved pattern
  # (scheduled-fetch-notify: trigger/http/llm) AND an `iteration` example, which that pattern has none
  # of. ③ is told never to search for one, so before the fix it searched anyway and the sandbox denied
  # it 25 times: implement 53 turns (run 1784267358546) vs 15 when SPEC.md happened to name
  # per-row-notify (run 1784263317775). This entry is that difference, pinned.
  prompt: >-
    スプレッドシート内のD列記載の月日が本日より以前で、T列が空の場合、催促文をLLMで作成させて
    ChatWorkに自動送信するフローを作成したい。 ワークフローのスタートはトリガーに設定し、GASで
    スプレッドシートと連携させたい。 ChatWorkはAPIで連携させ、F列の使用者名からGAS連携された
    ID一覧スプレッドシートを元に送信先IDを探して個別ChatWork自動送信させて。チャット送信文は
    LLMに経理担当の負担軽減への依頼である事を伝える文面を作成させたい。
  mode: auto
  deploy: none
  expect:
    analyze:
      # features only — NO `pattern:` pin. NO pattern carries both trigger and iteration (checked
      # against index.json), so this prompt has no exact fit and the pick is a judgment call that
      # legitimately varies: 3 runs chose scheduled-fetch-notify, 1 chose `custom` — and `custom` gave
      # the LEANEST ③ (15 turns), composing from per-row-notify + scheduled-fetch-notify by itself.
      # Pinning the name would AUTO-FAIL a correct build ~1 run in 4. What the requirement actually
      # demands is that ① RECOGNISE both needs; how it labels the pattern is downstream opinion.
      features_include: [trigger, iteration]
    workflow:
      # Asia/Tokyo: Dify defaults a schedule trigger to UTC, which silently shifts the "before today"
      # comparison this whole workflow turns on.
      grep_present:
        - "type: trigger-schedule"
        - "timezone: Asia/Tokyo"
        - "type: iteration"
        - "X-ChatWorkToken"          # AGENTS.md §9: a custom auth header…
        - "type: no-auth"            # …needs no-auth, or api-key auth rewrites it away
      grep_absent: ["type: start"]
    report:
      notes_include: ["passed every automated check"]
  cost:
    # The regression this entry exists for. Measured ③: 15 turns (pointer present) · 17 · 53 (pointer
    # withheld → 25 denied greps). 30 separates the failure mode from run-to-run wobble; it is a gross
    # guard, not a target — tightening it to chase a few turns would just make the suite cry wolf.
    implement_turns_max: 30
    total_turns_max: 60          # 39 / 50 measured green; the thrashing run totalled 69
    cache_min_pct: 50
  manual:
    - "The GAS Web App URL ships as TODO_GAS_DEPLOYMENT_ID — deploy the script and paste the real URL"
    - "The GAS response shape ({today, rows[], id_map{}}) is the build's ASSUMPTION; the real script must match it or the code node breaks"
    - "Fill CHATWORK_API_TOKEN + GAS_SHARED_TOKEN in Dify (env secrets ship empty by design) and add a model"
    - "Enable the trigger in Dify Studio → Quick Settings, or it never fires (S5 deferred — no enable API)"
    - "SPEC asks an open question the harness cannot answer: schedule-Pull vs GAS-Push. A human decides"
    - "Runtime: each overdue row reaches the right ChatWork room, one message per person"

- id: excel-per-row-notify
  prompt: >-
    アップロードされたExcelの各行について、氏名と金額を読み取り、
    1行ずつ Slack 風の通知メッセージを組み立てて出力してください。
  mode: auto
  deploy: none
  expect:
    analyze:
      features_include: [iteration]
    workflow:
      grep_present: ["type: iteration"]
  manual:
    - "Attachment path: this suite fires without a file — verify the shape only; a real upload is manual"
    - "Runtime: per-row messages match the sheet"

- id: fast-single-llm
  prompt: ユーザーが入力した英文を日本語に翻訳するだけのワークフロー。
  mode: auto
  fast: true
  deploy: none
  expect:
    analyze:
      features_include: [llm]
    workflow:
      grep_present: ["type: llm", "type: start", "type: end"]
  manual:
    - "Fast mode: confirm the build used a single LLM turn (⚡) and did not over-build"

- id: edit-existing
  prompt: この翻訳ワークフローに、翻訳後の文字数をカウントする Code ノードを追加してください。
  mode: each_step
  deploy: none
  project: null   # set to an existing slug at run time; --project pass-through
  expect:
    analyze:
      features_include: [code]
    workflow:
      grep_present: ["type: code"]
  manual:
    - "Requires a base workflow; set project to an existing slug before firing (OQ2 — --project only)"
    - "each_step: review each gate artifact before confirming"

- id: lang-sync-vi
  prompt: Tạo workflow nhận vào một đoạn văn tiếng Việt và tóm tắt thành 3 câu.
  mode: auto
  deploy: none
  expect:
    analyze:
      features_include: [llm]
    workflow:
      grep_present: ["type: llm"]
  manual:
    - "Language sync: the digest + SPEC should be in Vietnamese (matches the prompt), not JA"
