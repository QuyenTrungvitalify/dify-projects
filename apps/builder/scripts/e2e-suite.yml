# e2e-suite.yml — regression prompts the Builder is expected to handle (spec 058).
#
# Each entry drives ONE simulated user build. `expect` predicates are evaluated mechanically by
# e2e_check.py into three buckets: AUTO-PASS / AUTO-FAIL / MANUAL. `manual:` items are things the
# harness KNOWS it cannot auto-verify (runtime behavior, UI rendering, trigger enablement) — they
# are echoed as MANUAL after every run and reported to the user, never silently dropped.
#
# Vocabulary (kept tiny on purpose — YAGNI):
#   analyze:  { features_include: [..], features_exclude: [..], pattern: <name> }
#   workflow: { grep_present: [..], grep_absent: [..] }     # raw substring over main.yml
#   report:   { notes_include: [..] }                        # report.json.notes is ONE string
#   manual:   [ "<free-text item to verify by hand>", ... ]
# Fire parameters (read by `fire --entry <id>`): prompt, mode (auto|each_step), fast, deploy, project.
# deploy defaults to `none` (no app created in the user's Dify). TRIGGER_ENTRY_NOTE only reaches
# report.notes on selfhost/cloud (report.ts:198), so with deploy:none the note check lives in manual:.

- id: trigger-schedule
  prompt: >-
    毎朝9時に https://jsonplaceholder.typicode.com/todos?userId=1 のJSONを取得して、
    completed が false のタスクの件数とタイトルを日本語で3行以内にまとめ、
    その結果を https://httpbin.org/post へPOSTしてください。
  mode: auto
  deploy: none
  expect:
    analyze:
      features_include: [trigger]
      pattern: scheduled-fetch-notify
    workflow:
      grep_present: ["type: trigger-schedule", "timezone: Asia/Tokyo"]
      grep_absent: ["type: start"]
    report:
      # NOT "all linters passed" — spec 066 S5 retired that line as jargon ("linter" → 「リンター」) and
      # report.ts now emits this plain sentence. The old expectation would AUTO-FAIL every green run.
      notes_include: ["passed every automated check"]
  cost:                      # spec 060 — gross-regression guard (generous; real ③≈20 turns, cache≈98%)
    implement_turns_max: 40  # AUTO-FAIL if the ③ lint→fix loop churns way past its ~20-turn norm
    total_turns_max: 90
    cache_min_pct: 50        # AUTO-FAIL if prompt-caching stops hitting (cold-start regression)
  manual:
    - "Enable the trigger in Dify Studio → Quick Settings and confirm the 9:00 JST fire (S5 deferred — no enable API)"
    - "UI: the JA trigger-entry note renders on the ④ test card (NOTE_JA frame in i18n.ts)"
    - "Runtime: with model filled + imported, the LLM summary is Japanese and ≤3 lines"

- id: negative-no-trigger
  prompt: 入力されたテキストを3行に要約するワークフローを作ってください。
  mode: auto
  deploy: none
  expect:
    analyze:
      features_exclude: [trigger]
    workflow:
      grep_present: ["type: start"]
      grep_absent: ["type: trigger-schedule"]
  manual:
    - "Runtime: paste a paragraph, confirm the summary is 3 lines"

- id: webhook-per-row-chatwork
  # The PUSH twin of trigger-per-row-chatwork, and a deterministic repro for the schema-extraction
  # hole. The base prompt is ambiguous between Pull (schedule) and Push (webhook) — SPEC flags it as an
  # open question — so builds pick webhook only ~1 run in 5. This prompt REMOVES the ambiguity: GAS
  # POSTs to a Dify webhook, full stop. That forces ③ onto trigger-webhook, a node NO pattern ships an
  # example of, where the manual run 1784278684526 burned 44 turns / 13 denied greps: it FOUND
  # schemas/dify-dsl-0.6.0.json (7,704 lines; the def sits at line ~6,687) but had no allowed way to
  # extract one $def — grep/rg/python -c all denied, `--dump-schema` didn't exist — so it Read all
  # 182KB three times and reverse-engineered the linter source. The cost caps here are the tripwire:
  # they FAIL on that behavior and pass once a sanctioned extraction path exists.
  prompt: >-
    GAS から Dify の Webhook トリガーへ POST でスプレッドシートの行データ（督促候補行 rows_json・
    使用者名→ChatWork送信先の対応表 id_map_json・実行日 today）を送信するので、その Webhook 受信を
    起点とするフローを作成したい。受信した行のうち「D列の月日が本日より以前 かつ T列が空」の行だけを
    対象に、F列の使用者名から送信先IDを解決し、経理担当の負担軽減への依頼である事を伝える催促文を
    LLMで作成して ChatWork API で1人ずつ個別送信して。スケジュール起動ではなく Webhook 受信起動で。
  mode: auto
  deploy: none
  expect:
    analyze:
      features_include: [trigger, iteration]
    workflow:
      grep_present:
        - "type: trigger-webhook"
        - "type: iteration"
        - "X-ChatWorkToken"
        - "type: no-auth"
      # the wrong shapes node_types.md teaches AND the schedule fallback — absent = built the real thing
      grep_absent: ["type: start", "type: trigger-schedule"]
    report:
      # Second line: the external-input contract advisory (sourceContractNote). Locked only after
      # it appeared with correct fields in TWO real campaign builds (quiz-gen G03, ops-mix G01) —
      # per the wait-for-2-samples rule in CAMPAIGNS. Phrase is the stable stem of the note, not
      # the per-build field list.
      notes_include: ["passed every automated check", "must call the webhook URL"]
  cost:
    implement_turns_max: 30   # the 44-turn schema hunt trips this; a pointed build (15–18) clears it
    total_turns_max: 60
    cache_min_pct: 50
    # spec 071 S2 — the RIGHT axis for this entry. Turns hid the thrash (a 22-denied run passed the
    # 30-turn cap); denied-call count does not. Measured: webhook-no-pattern 12–22 denied, a build
    # with the pattern ~4. Threshold 8 splits them (clean ≤5, sick ≥12). This row is EXPECTED RED
    # until spec 071 S1 lands templates/patterns/webhook-per-row-notify.yml — it is the tripwire that
    # goes green when the fix lands, not a claim the current build is broken (it passes every other check).
    denied_calls_max: 8
  manual:
    - "GAS must actually POST {rows_json, id_map_json, today} to the webhook URL Dify shows after import"
    - "Fill CHATWORK_API_TOKEN (+ any GAS shared secret) in Dify and add a model"
    - "Enable the trigger in Dify Studio → Quick Settings, or it never fires"
    - "Runtime: each overdue row reaches the right ChatWork room, one message per person"

- id: trigger-per-row-chatwork
  # The build that exposed the {{REFERENCES}} gap. It needs TWO shapes at once — the approved pattern
  # (scheduled-fetch-notify: trigger/http/llm) AND an `iteration` example, which that pattern has none
  # of. ③ is told never to search for one, so before the fix it searched anyway and the sandbox denied
  # it 25 times: implement 53 turns (run 1784267358546) vs 15 when SPEC.md happened to name
  # per-row-notify (run 1784263317775). This entry is that difference, pinned.
  prompt: >-
    スプレッドシート内のD列記載の月日が本日より以前で、T列が空の場合、催促文をLLMで作成させて
    ChatWorkに自動送信するフローを作成したい。 ワークフローのスタートはトリガーに設定し、GASで
    スプレッドシートと連携させたい。 ChatWorkはAPIで連携させ、F列の使用者名からGAS連携された
    ID一覧スプレッドシートを元に送信先IDを探して個別ChatWork自動送信させて。チャット送信文は
    LLMに経理担当の負担軽減への依頼である事を伝える文面を作成させたい。
  mode: auto
  deploy: none
  expect:
    analyze:
      # features only — NO `pattern:` pin. NO pattern carries both trigger and iteration (checked
      # against index.json), so this prompt has no exact fit and the pick is a judgment call that
      # legitimately varies: 3 runs chose scheduled-fetch-notify, 1 chose `custom` — and `custom` gave
      # the LEANEST ③ (15 turns), composing from per-row-notify + scheduled-fetch-notify by itself.
      # Pinning the name would AUTO-FAIL a correct build ~1 run in 4. What the requirement actually
      # demands is that ① RECOGNISE both needs; how it labels the pattern is downstream opinion.
      features_include: [trigger, iteration]
    workflow:
      # Asia/Tokyo: Dify defaults a schedule trigger to UTC, which silently shifts the "before today"
      # comparison this whole workflow turns on.
      grep_present:
        - "type: trigger-schedule"
        - "timezone: Asia/Tokyo"
        - "type: iteration"
        - "X-ChatWorkToken"          # AGENTS.md §9: a custom auth header…
        - "type: no-auth"            # …needs no-auth, or api-key auth rewrites it away
      grep_absent: ["type: start"]
    report:
      notes_include: ["passed every automated check"]
  cost:
    # The regression this entry exists for. Measured ③: 15 turns (pointer present) · 17 · 53 (pointer
    # withheld → 25 denied greps). 30 separates the failure mode from run-to-run wobble; it is a gross
    # guard, not a target — tightening it to chase a few turns would just make the suite cry wolf.
    implement_turns_max: 30
    total_turns_max: 60          # 39 / 50 measured green; the thrashing run totalled 69
    cache_min_pct: 50
    denied_calls_max: 8          # spec 071 S2 — schedule has a pattern, so this stays green (~4); it
                                 # is the same tripwire as the webhook entry, guarding a regression here.
  manual:
    - "The GAS Web App URL ships as TODO_GAS_DEPLOYMENT_ID — deploy the script and paste the real URL"
    - "The GAS response shape ({today, rows[], id_map{}}) is the build's ASSUMPTION; the real script must match it or the code node breaks"
    - "Fill CHATWORK_API_TOKEN + GAS_SHARED_TOKEN in Dify (env secrets ship empty by design) and add a model"
    - "Enable the trigger in Dify Studio → Quick Settings, or it never fires (S5 deferred — no enable API)"
    - "SPEC asks an open question the harness cannot answer: schedule-Pull vs GAS-Push. A human decides"
    - "Runtime: each overdue row reaches the right ChatWork room, one message per person"

- id: excel-per-row-notify
  prompt: >-
    アップロードされたExcelの各行について、氏名と金額を読み取り、
    1行ずつ Slack 風の通知メッセージを組み立てて出力してください。
  mode: auto
  deploy: none
  expect:
    analyze:
      features_include: [iteration]
    workflow:
      grep_present: ["type: iteration"]
  manual:
    - "Attachment path: this suite fires without a file — verify the shape only; a real upload is manual"
    - "Runtime: per-row messages match the sheet"

- id: fast-single-llm
  prompt: ユーザーが入力した英文を日本語に翻訳するだけのワークフロー。
  mode: auto
  fast: true
  deploy: none
  expect:
    analyze:
      features_include: [llm]
    workflow:
      grep_present: ["type: llm", "type: start", "type: end"]
    report:
      # spec 078 S2 — a trivial single-LLM shape (<4 nodes) must NEVER get the promote nudge.
      # Only `false` is suite-stable: `true` self-quenches after a promote (see e2e_check.py).
      promote_hint_present: false
  manual:
    - "Fast mode: confirm the build used a single LLM turn (⚡) and did not over-build"

- id: edit-existing
  prompt: この翻訳ワークフローに、翻訳後の文字数をカウントする Code ノードを追加してください。
  mode: each_step
  deploy: none
  project: null   # set to an existing slug at run time; --project pass-through
  expect:
    analyze:
      features_include: [code]
    workflow:
      grep_present: ["type: code"]
  manual:
    - "Requires a base workflow; set project to an existing slug before firing (OQ2 — --project only)"
    - "each_step: review each gate artifact before confirming"

- id: code-preserve-translate
  # spec 076 E2b — the intent-search win, pinned. Before E2b, phase ① ran only `find.py --has`, missed
  # the curated example/main.yml (md_en2ja: mask/restore code with two code nodes), and built a bare
  # start→llm→end that silently corrupts fenced/inline code. E2b adds an intent `find.py --name` pass
  # that surfaces example/main.yml, and the build reproduces the mask→translate→restore shape. A
  # regression to single-LLM drops the code nodes → features_include:[code] + `type: code` AUTO-FAIL.
  # (Validated: run 1785076663337 built start→code→llm→code→end, lint 0/0/0.)
  prompt: Dịch một tài liệu markdown tiếng Anh sang tiếng Nhật, giữ nguyên các đoạn code.
  mode: auto
  deploy: none
  expect:
    analyze:
      features_include: [code, llm]
    workflow:
      grep_present: ["type: code", "type: llm"]
  manual:
    - "Shape: expect mask → translate → restore (two code nodes around the LLM), the example/main.yml pattern"
    - "Language sync: digest + SPEC in Vietnamese (matches the prompt)"
    - "Runtime: with a model filled, fenced/inline code survives translation verbatim"

- id: lang-sync-vi
  prompt: Tạo workflow nhận vào một đoạn văn tiếng Việt và tóm tắt thành 3 câu.
  mode: auto
  deploy: none
  expect:
    analyze:
      features_include: [llm]
    workflow:
      grep_present: ["type: llm"]
  manual:
    - "Language sync: the digest + SPEC should be in Vietnamese (matches the prompt), not JA"

- id: qc-branch-routing
  # Spec 087 regression surface: a build whose model-carrying node is a QUESTION-CLASSIFIER (not llm).
  # Pre-087 this class of workflow imported clean but died at runtime as a generic stream-death (an
  # empty QC model does NOT even say "Model not exist" — dify-io.md §4), because inject/count/advisory
  # all covered `llm` only. The inject/gate/advisory sides are unit-locked (test_sync cross-check,
  # live-test.test.ts, runnability.test.ts); THIS entry locks the build side: a clearly-branching JA
  # prompt still yields a lint-clean question-classifier workflow.
  prompt: >-
    問い合わせメールの本文を貼り付けたら、内容を「請求・支払い」「不具合・技術的な問題」「その他」の
    3種類に自動で振り分けてください。種類ごとに転送先が違います（経理窓口 / サポート窓口 / 総合窓口）。
    転送先の名前と、その転送先に合わせた文体の転送用の一言添え文を返してください。3種類で添え文の
    形式・トーンは変えてください。
  mode: auto
  deploy: none
  expect:
    analyze:
      features_include: [question-classifier]
    workflow:
      grep_present: ["type: question-classifier"]
      grep_absent: ["type: trigger-schedule", "type: trigger-webhook"]
    report:
      notes_include: ["passed every automated check"]
  manual:
    - "Live-test (selfhost): the question-classifier node gets the workspace model injected and a JA sample input runs to succeeded (the 087 A/B runbook — CAMPAIGNS.md 'Bằng chứng đo ngoài-campaign')"
    - "Runtime: three sample mails (billing / bug / other) route to the three 窓口 with distinct wording"
