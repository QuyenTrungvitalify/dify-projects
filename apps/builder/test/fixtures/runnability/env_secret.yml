# Spec 066 S2 fixture — the fifth blocker class (`env_secret_empty`), taken from the shape of a REAL
# naive build (run 1784192313811, 「毎朝…Slackに通知」): Dify's own answer for a webhook URL is an env
# secret, and the Builder correctly declared one — with an empty value the human must paste in.
#
# It exercises BOTH halves of the predicate, so a port that checks only "empty" fails here:
#   SLACK_WEBHOOK_URL — empty AND referenced via {{#env.…#}}    → BLOCKER (template form)
#   API_TOKEN         — empty AND referenced via value_selector → BLOCKER (selector form — a port that
#                       greps only the template form MISSES this: a false negative, the exact failure
#                       this class exists to end. lint_refs.py walks both; so must we.)
#   OPTIONAL_UNUSED   — empty but referenced by nobody          → NOT a blocker (declaring an unused
#                       var costs the user nothing at runtime; flagging it would be a false alarm)
#   PRESET_CHANNEL    — referenced but already has a value      → NOT a blocker
#
# The model is filled and there is no code/knowledge-retrieval node, so `env_secret_empty` is the ONLY
# class this file produces — which is what makes it a sharp parity fixture.
app:
  name: env-secret-fixture
  mode: workflow
dependencies: []
kind: app
version: 0.6.0
workflow:
  environment_variables:
  - name: SLACK_WEBHOOK_URL
    value_type: secret
    value: ''
  - name: API_TOKEN
    value_type: secret
    value: ''
  - name: OPTIONAL_UNUSED
    value_type: string
    value: ''
  - name: PRESET_CHANNEL
    value_type: string
    value: '#general'
  graph:
    edges: []
    nodes:
    - id: n1
      data:
        type: llm
        title: Summarize
        model:
          provider: langgenius/openai/openai
          name: gpt-4o-mini
          mode: chat
          completion_params: {}
    - id: n2
      data:
        type: http-request
        title: Notify Slack
        method: post
        url: '{{#env.SLACK_WEBHOOK_URL#}}'
        headers: 'X-Channel: {{#env.PRESET_CHANNEL#}}'
        params: ''
        body:
          type: json
          data: '{"text": "hi"}'
    # The SELECTOR reference form — Dify builds env refs as [env, NAME]
    # (vendor/dify-src variable_factory.py). A probe that only greps {{#env.…#}} sees nothing here.
    - id: n3
      data:
        type: tool
        title: Call an API with a token
        # The real node-identity shape (docs/runtime-supplement.md): provider_type `builtin` — NOT
        # `plugin` — and provider_name == provider_id, 3 segments ("provider name doubled").
        provider_id: omluc/google_sheets/google_sheets
        provider_type: builtin
        provider_name: omluc/google_sheets/google_sheets
        tool_name: batch_get
        tool_label: Google Sheets
        tool_configurations: {}
        tool_parameters:
          token:
            type: mixed
            value_selector:
            - env
            - API_TOKEN
