# Parity fixture: spec 095 S5 — the SIXTH class, `tool_auth`.
#
# Two marketplace tool nodes sharing ONE provider (the real shape that produced this class: a build
# with `A9a: Tavily search (30d)` and `B6a: Tavily search (7d)`) plus a Dify-native builtin. The
# fixture pins BOTH halves of the predicate:
#   - a slashed provider_id (org/plugin/provider) = a marketplace plugin the user must connect → flagged
#     ONCE, not once per node (two nodes, one thing to go connect);
#   - a bare provider_id (a Dify-native tool, nothing to connect) → NOT flagged, so the class cannot
#     become a blanket "every tool node is a blocker" false alarm.
# Everything else here is deliberately clean so `tool_auth` is the ONLY class this file yields.
