kind: app
version: 0.6.0
app:
  name: Workflow LLM đơn giản
  description: >-
    Workflow LLM tối giản: người dùng nhập một đoạn văn bản, đưa qua một node LLM
    để xử lý, và trả kết quả ra ngoài (start → llm → end).
  mode: workflow
  icon: 🤖
  icon_background: '#FFEAD5'
  use_icon_as_answer_icon: false
# TODO: add plugin hash from target workspace — real marketplace_plugin_unique_identifier
#       for the LLM provider (e.g. langgenius/anthropic:<ver>@<sha256>). Never fabricate (§4.3).
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
      - id: '1783341237471'
        type: custom
        data:
          type: start
          title: Start
          desc: ''
          selected: false
          variables:
            - variable: user_input
              label: User Input
              type: paragraph
              required: true
              max_length: 10000
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        width: 244
        height: 90
        selected: false
        sourcePosition: right
        targetPosition: left
      - id: '1783341237473'
        type: custom
        data:
          type: llm
          title: LLM
          desc: ''
          selected: false
          model:
            provider: anthropic
            name: claude-3-5-sonnet-20241022
            mode: chat
            completion_params:
              temperature: 0.7
          prompt_template:
            - id: system-prompt-1
              role: system
              text: You are a helpful assistant.
            - id: user-prompt-1
              role: user
              text: '{{#1783341237471.user_input#}}'
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        position:
          x: 380
          y: 282
        positionAbsolute:
          x: 380
          y: 282
        width: 244
        height: 98
        selected: false
        sourcePosition: right
        targetPosition: left
      - id: '1783343933564'
        type: custom
        data:
          type: template-transform
          title: Format Output
          desc: ''
          selected: false
          variables:
            - variable: text
              value_selector:
                - '1783341237473'
                - text
          template: |-
            {{ text }}
        position:
          x: 680
          y: 282
        positionAbsolute:
          x: 680
          y: 282
        width: 244
        height: 54
        selected: false
        sourcePosition: right
        targetPosition: left
      - id: '1783341237475'
        type: custom
        data:
          type: end
          title: End
          desc: ''
          selected: false
          outputs:
            - variable: result
              value_selector:
                - '1783343933564'
                - output
        position:
          x: 980
          y: 282
        positionAbsolute:
          x: 980
          y: 282
        width: 244
        height: 90
        selected: false
        sourcePosition: right
        targetPosition: left
    edges:
      - id: 1783341237471-source-1783341237473-target
        source: '1783341237471'
        sourceHandle: source
        target: '1783341237473'
        targetHandle: target
        type: custom
        data:
          sourceType: start
          targetType: llm
          isInIteration: false
        zIndex: 0
        selected: false
      - id: 1783341237473-source-1783343933564-target
        source: '1783341237473'
        sourceHandle: source
        target: '1783343933564'
        targetHandle: target
        type: custom
        data:
          sourceType: llm
          targetType: template-transform
          isInIteration: false
        zIndex: 0
        selected: false
      - id: 1783343933564-source-1783341237475-target
        source: '1783343933564'
        sourceHandle: source
        target: '1783341237475'
        targetHandle: target
        type: custom
        data:
          sourceType: template-transform
          targetType: end
          isInIteration: false
        zIndex: 0
        selected: false
  viewport:
    x: 0
    y: 0
    zoom: 1
