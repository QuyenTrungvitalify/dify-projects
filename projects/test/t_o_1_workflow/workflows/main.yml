app:
  description: 'Một chatbot hội thoại đơn giản: người dùng nhập tin nhắn, một node
    LLM sinh câu trả lời và trả về trực tiếp cho người dùng.'
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: Chatbot LLM đơn giản
kind: app
version: 0.6.0
dependencies: []  # TODO: add plugin hash from target workspace (model plugin for the llm node)
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: 1783262184702-source-1783262184704-target
      source: '1783262184702'
      target: '1783262184704'
      sourceHandle: source
      targetHandle: target
      type: custom
      selected: false
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
    - id: 1783262184704-source-1783262810538-target
      source: '1783262184704'
      target: '1783262810538'
      sourceHandle: source
      targetHandle: target
      type: custom
      selected: false
      data:
        sourceType: llm
        targetType: code
        isInIteration: false
    - id: 1783262810538-source-1783262184707-target
      source: '1783262810538'
      target: '1783262184707'
      sourceHandle: source
      targetHandle: target
      type: custom
      selected: false
      data:
        sourceType: code
        targetType: answer
        isInIteration: false
    nodes:
    - id: '1783262184702'
      type: custom
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: Bắt đầu
        desc: ''
        variables: []
    - id: '1783262184704'
      type: custom
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      width: 244
      height: 98
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: LLM
        desc: 'Nhận câu hỏi người dùng và sinh câu trả lời hội thoại.'
        # TODO: add plugin hash from target workspace; confirm provider/name match an
        # installed chat model in the target Dify workspace before import.
        model:
          provider: langgenius/anthropic/anthropic
          name: claude-sonnet-4-20250514
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: Bạn là một trợ lý hữu ích, trả lời người dùng một cách rõ ràng và thân thiện.
        - role: user
          text: '{{#sys.query#}}'
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: '1783262810538'
      type: custom
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: Hậu xử lý
        desc: 'Chuẩn hoá câu trả lời của LLM (cắt khoảng trắng, chèn footer test).'
        code_language: python3
        code: |
          def main(text: str) -> dict:
              # Guard None/"" from upstream (§4.5): llm.text can be empty.
              reply = (text or "").strip()
              if not reply:
                  reply = "Xin lỗi, mình chưa có câu trả lời."
              return {"result": reply + "\n\n— (trả lời bởi chatbot test)"}
        variables:
        - variable: text
          value_selector:
          - '1783262184704'
          - text
        outputs:
          result:
            type: string
    - id: '1783262184707'
      type: custom
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      width: 244
      height: 106
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: answer
        title: Trả lời
        desc: 'Trả câu trả lời đã hậu xử lý về cho người dùng.'
        answer: '{{#1783262810538.result#}}'
        variables: []
