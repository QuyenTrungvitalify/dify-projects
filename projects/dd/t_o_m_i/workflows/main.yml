app:
  description: 'Workflow LLM tối giản: nhận một đoạn văn bản đầu vào, đưa qua một node
    LLM để xử lý và trả về kết quả. Khung sườn single-LLM cơ bản để mở rộng sau này.'
  icon: "\U0001F4DD"
  icon_background: '#E1F0FF'
  icon_type: emoji
  mode: workflow
  name: Workflow LLM đơn giản
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
dependencies: []  # TODO: add plugin hash from target workspace (model plugin for the llm node)
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: { enabled: false }
    opening_statement: ''
    retriever_resource: { enabled: true }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions: []
    suggested_questions_after_answer: { enabled: false }
    text_to_speech: { enabled: false, language: '', voice: '' }
  graph:
    edges:
    - id: 1783338012560-source-1783338012562-target
      source: '1783338012560'
      target: '1783338012562'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: start, targetType: llm }
      zIndex: 0
    - id: 1783338012562-source-1783338723184-target
      source: '1783338012562'
      target: '1783338723184'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: llm, targetType: code }
      zIndex: 0
    - id: 1783338723184-source-1783338012565-target
      source: '1783338723184'
      target: '1783338012565'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: code, targetType: end }
      zIndex: 0
    nodes:
    - id: '1783338012560'
      type: custom
      data:
        title: Bắt đầu
        type: start
        variables:
        - variable: input
          label: input
          type: paragraph
          required: true
          max_length: 5000
          hint: 'Đoạn văn bản người dùng muốn xử lý.'
          options: []
          placeholder: ''
      position: { x: 0, y: 280 }
      positionAbsolute: { x: 0, y: 280 }
      width: 242
      height: 107
      sourcePosition: right
      targetPosition: left

    - id: '1783338012562'
      type: custom
      data:
        title: LLM
        type: llm
        desc: 'Node xử lý duy nhất — nhận đầu vào và sinh kết quả theo prompt.'
        # TODO: add plugin hash from target workspace; confirm provider/name khớp một
        # model đã cài trong workspace Dify đích trước khi import.
        model:
          provider: langgenius/anthropic/anthropic
          name: claude-sonnet-4-20250514
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: |
            Bạn là một trợ lý xử lý văn bản. Nhận đoạn văn bản của người dùng và xử lý
            theo yêu cầu, trả về kết quả rõ ràng, mạch lạc.
            # TODO: làm rõ mục đích biến đổi (dịch / tóm tắt / sinh nội dung…) và ngôn ngữ đầu ra.
        - role: user
          text: '{{#1783338012560.input#}}'
        memory: null
        context: { enabled: false, variable_selector: [] }
        vision: { enabled: false }
      position: { x: 342, y: 280 }
      positionAbsolute: { x: 342, y: 280 }
      width: 241
      height: 98
      sourcePosition: right
      targetPosition: left

    - id: '1783338723184'
      type: custom
      data:
        title: Hậu xử lý
        type: code
        desc: 'Node test — chuẩn hoá kết quả LLM (cắt khoảng trắng, chèn footer).'
        code_language: python3
        code: |
          def main(text: str) -> dict:
              # Guard None/"" từ upstream (§4.5): llm.text có thể rỗng.
              result = (text or "").strip()
              if not result:
                  result = "(không có nội dung)"
              return {"result": result + "\n\n— (đã hậu xử lý)"}
        variables:
        - variable: text
          value_selector: ['1783338012562', text]
        outputs:
          result:
            type: string
      position: { x: 684, y: 280 }
      positionAbsolute: { x: 684, y: 280 }
      width: 241
      height: 90
      sourcePosition: right
      targetPosition: left

    - id: '1783338012565'
      type: custom
      data:
        title: Kết thúc
        type: end
        outputs:
        - variable: output
          value_selector: ['1783338723184', result]
          value_type: string
      position: { x: 1026, y: 280 }
      positionAbsolute: { x: 1026, y: 280 }
      width: 241
      height: 90
      sourcePosition: right
      targetPosition: left

    viewport: { x: 0, y: 0, zoom: 0.7 }
