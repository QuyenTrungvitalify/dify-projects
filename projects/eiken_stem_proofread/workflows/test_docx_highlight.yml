# Test workflow — verify Markdown → DOCX highlight rendering
#
# Mục đích: kiểm tra plugin bowenliang123/md_exporter `md_to_docx` có render được
# color/underline/bold trong DOCX không, để quyết định format output cuối cùng cho
# main.yml (xem spec_todo/spec_change_v2.md section "Output Highlighting Options").
#
# Cách chạy:
#   1. Import file này vào Dify Studio (App → Import → upload YAML)
#   2. Run workflow (không cần input — Code node tự generate test cases)
#   3. Tải file `docx_highlight_test.docx` về, mở Word
#   4. Check từng section xem syntax nào render đúng

app:
  description: 'Test DOCX rendering capability for md_to_docx plugin — verify color/underline/bold support'
  icon: "\U0001F9EA"
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: workflow
  name: 'Test DOCX Highlight Rendering'
  use_icon_as_answer_icon: false

dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: bowenliang123/md_exporter:2.1.1@63ea80ece23673b1579c0ff64e6dc731e1b4baebca1fcce4d45fda17d962bfc8
    version: null

kind: app
version: 0.6.0

workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        workflow_file_upload_limit: 10
      number_limits: 3
    opening_statement: ''
    retriever_resource: { enabled: true }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions: []
    suggested_questions_after_answer: { enabled: false }
    text_to_speech: { enabled: false, language: '', voice: '' }

  graph:
    edges:
    - id: start-to-code
      source: '1779000000001'
      target: '1779000000002'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: start, targetType: code }
      zIndex: 0
    - id: code-to-tool
      source: '1779000000002'
      target: '1779000000003'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: code, targetType: tool }
      zIndex: 0
    - id: tool-to-end
      source: '1779000000003'
      target: '1779000000004'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: tool, targetType: end }
      zIndex: 0

    nodes:
    - id: '1779000000001'
      type: custom
      data:
        title: 'Start (no input needed)'
        type: start
        variables: []
      position: { x: 0, y: 280 }
      positionAbsolute: { x: 0, y: 280 }
      width: 242
      height: 54
      sourcePosition: right
      targetPosition: left

    - id: '1779000000002'
      type: custom
      data:
        title: 'Build test markdown'
        type: code
        code_language: python3
        code: |
          def main() -> dict:
              """Generate markdown with multiple highlight syntax options to test
              what md_to_docx plugin actually renders in Word."""
              lines = []
              lines.append("# DOCX Highlight Rendering Test")
              lines.append("")
              lines.append("Test which Markdown/HTML syntax renders correctly in DOCX")
              lines.append("when using bowenliang123/md_exporter md_to_docx tool.")
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section A - HTML inline color (RED + UNDERLINE)")
              lines.append("Expected: word 'dont' appears red with underline")
              lines.append("")
              lines.append('I <span style="color:red;text-decoration:underline">dont</span> to read from a paper.')
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section B - Markdown bold (standard syntax)")
              lines.append("Expected: word 'dont' appears bold")
              lines.append("")
              lines.append("I **dont** to read from a paper.")
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section C - Pandoc attribute syntax")
              lines.append("Expected: usually NOT rendered unless converter supports it")
              lines.append("")
              lines.append('I [dont]{.error style="color:red"} to read from a paper.')
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section D - Combined background + bold (yellow highlight)")
              lines.append("Expected: word 'dont' has yellow background + bold")
              lines.append("")
              lines.append('I <span style="background-color:yellow"><b>dont</b></span> to read from a paper.')
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section E - Markdown strikethrough")
              lines.append("Expected: word 'dont' has strikethrough")
              lines.append("")
              lines.append("I ~~dont~~ to read from a paper.")
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section F - HTML underline only")
              lines.append("Expected: word 'dont' has underline (no color)")
              lines.append("")
              lines.append("I <u>dont</u> to read from a paper.")
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section G - Real Eiken sample (multi-line dialog)")
              lines.append("Expected: newline preserved between A: and B:, color renders")
              lines.append("")
              lines.append("A: How are you going to prepare for your history presentation?")
              lines.append("")
              lines.append('B: I am going to learn the speech by heart. I <span style="color:red;text-decoration:underline">dont</span> to read from a paper.')
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section H - Multiple errors in one sentence")
              lines.append("Expected: both 'have' and 'apple' marked red")
              lines.append("")
              lines.append('She <span style="color:red;text-decoration:underline">have</span> a <span style="color:red;text-decoration:underline">apple</span> yesterday.')
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section I - Comparison table")
              lines.append("Expected: table renders + inline formatting inside cells")
              lines.append("")
              lines.append("| # | Original | Highlighted |")
              lines.append("|---|----------|-------------|")
              lines.append("| 1 | I dont to read. | I **dont** to read. |")
              lines.append('| 2 | She have apple. | She <span style="color:red">have</span> <span style="color:red">apple</span>. |')
              lines.append("| 3 | He are happy. | He <u>are</u> happy. |")
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section J - Realistic table design (5 columns)")
              lines.append("Expected: table with bold+strikethrough inline in Fixed column")
              lines.append("")
              lines.append("| # | Item ID | Original | Fixed (markers) | Errors |")
              lines.append("|---|---------|----------|----------------|--------|")
              lines.append("| 1 | E2-001 | I dont to read from a paper. | I ~~dont~~ **don't** to read from a paper. | dont -> don't (grammar) |")
              lines.append("| 2 | E2-002 | She have a apple yesterday. | She ~~have~~ **has** ~~a~~ **an** apple yesterday. | have -> has; a -> an |")
              lines.append("| 3 | E2-003 | He are very happy. | He ~~are~~ **is** very happy. | are -> is (subject-verb) |")
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Section K - Multi-line dialog handling in table cell")
              lines.append("Expected: test 3 ways to handle A:/B: format inside table cell")
              lines.append("")
              lines.append("### K1: Join with space")
              lines.append("")
              lines.append("| # | Original | Fixed |")
              lines.append("|---|----------|-------|")
              lines.append("| 1 | A: How are you going? B: I'm going to learn by heart. I dont to read. | A: How are you going? B: I'm going to learn by heart. I ~~dont~~ **don't** to read. |")
              lines.append("")
              lines.append("### K2: Visible separator")
              lines.append("")
              lines.append("| # | Original | Fixed |")
              lines.append("|---|----------|-------|")
              lines.append("| 1 | A: How are you going? / B: I'm going to learn by heart. I dont to read. | A: How are you going? / B: I'm going to learn by heart. I ~~dont~~ **don't** to read. |")
              lines.append("")
              lines.append("### K3: HTML br (likely stripped)")
              lines.append("")
              lines.append("| # | Original | Fixed |")
              lines.append("|---|----------|-------|")
              lines.append("| 1 | A: How are you going?<br>B: I'm going to learn by heart. I dont to read. | A: How are you going?<br>B: I'm going to learn by heart. I ~~dont~~ **don't** to read. |")
              lines.append("")
              lines.append("---")
              lines.append("")
              lines.append("## Decision matrix (manual check)")
              lines.append("")
              lines.append("After opening this DOCX, mark which sections rendered correctly:")
              lines.append("")
              lines.append("- [ ] Section A: HTML color + underline")
              lines.append("- [ ] Section B: Markdown bold")
              lines.append("- [ ] Section C: Pandoc attribute")
              lines.append("- [ ] Section D: HTML background + bold")
              lines.append("- [ ] Section E: Markdown strikethrough")
              lines.append("- [ ] Section F: HTML underline")
              lines.append("- [ ] Section G: Multi-line dialog + HTML")
              lines.append("- [ ] Section H: Multiple HTML spans")
              lines.append("- [ ] Section I: Table + inline formatting")
              lines.append("- [ ] Section J: Realistic 5-column table design")
              lines.append("- [ ] Section K1: Multi-line stem joined with space")
              lines.append("- [ ] Section K2: Multi-line stem with / separator")
              lines.append("- [ ] Section K3: Multi-line stem with <br> (likely fail)")
              lines.append("")
              lines.append("Pick winning syntax + multi-line strategy for Eiken main workflow.")

              md = "\n".join(lines)
              return {
                  "md_text": md,
                  "char_count": len(md),
                  "section_count": 11,
              }
        outputs:
          md_text: { type: string, children: null }
          char_count: { type: number, children: null }
          section_count: { type: number, children: null }
        variables: []
      position: { x: 342, y: 280 }
      positionAbsolute: { x: 342, y: 280 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left

