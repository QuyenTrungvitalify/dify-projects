# Test workflow — verify Dify Code Node có support openpyxl không
#
# Mục đích: kiểm tra xem có thể dùng openpyxl trực tiếp trong Code Node để
# write XLSX với rich text (underline + bold) cho từ lỗi, bypass limitation
# của md_to_xlsx plugin.
#
# 2-stage test:
#   Stage 1: openpyxl available trong sandbox? (check import + version)
#   Stage 2: Nếu YES, write rich text xlsx + thử return File
#
# Decision tree dựa trên kết quả:
#   - openpyxl missing → ❌ Idea fails, fallback CSV multi-column
#   - openpyxl OK + File return work → 🏆 BEST solution, apply ngay
#   - openpyxl OK + File return fail → 🟡 Cần plugin bridge (research thêm)
#
# Cách chạy:
#   1. Import vào Dify Studio
#   2. Run workflow (không cần input)
#   3. Đọc output dictionary để biết kết quả

app:
  description: 'Verify openpyxl + rich text + file return capability in Dify Code Node'
  icon: "\U0001F50D"
  icon_background: '#FEF3C7'
  icon_type: emoji
  mode: workflow
  name: 'Test openpyxl Feasibility'
  use_icon_as_answer_icon: false

dependencies: []

kind: app
version: 0.6.0

workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        workflow_file_upload_limit: 10
      number_limits: 3
    opening_statement: ''
    retriever_resource: { enabled: true }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions: []
    suggested_questions_after_answer: { enabled: false }
    text_to_speech: { enabled: false, language: '', voice: '' }

  graph:
    edges:
    - id: edge1
      source: '1779200000001'
      target: '1779200000002'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: start, targetType: code }
      zIndex: 0
    - id: edge2
      source: '1779200000002'
      target: '1779200000003'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: code, targetType: end }
      zIndex: 0

    nodes:
    - id: '1779200000001'
      type: custom
      data:
        title: 'Start'
        type: start
        variables: []
      position: { x: 0, y: 280 }
      positionAbsolute: { x: 0, y: 280 }
      width: 242
      height: 54
      sourcePosition: right
      targetPosition: left

    - id: '1779200000002'
      type: custom
      data:
        title: 'Feasibility checks'
        type: code
        code_language: python3
        code: |
          import base64
          import io

          def main() -> dict:
              """3-stage diagnostic check for openpyxl-based solution."""
              result = {
                  "stage1_openpyxl_available": False,
                  "stage1_version": "",
                  "stage1_error": "",
                  "stage2_rich_text_available": False,
                  "stage2_error": "",
                  "stage3_write_success": False,
                  "stage3_file_size_bytes": 0,
                  "stage3_base64_preview": "",
                  "stage3_base64_full": "",
                  "stage3_error": "",
                  "verdict": "",
              }

              # STAGE 1: Check openpyxl import
              try:
                  import openpyxl
                  result["stage1_openpyxl_available"] = True
                  result["stage1_version"] = openpyxl.__version__
              except ImportError as e:
                  result["stage1_error"] = f"ImportError: {str(e)}"
                  result["verdict"] = "FAIL - openpyxl not available, idea blocked"
                  return result
              except Exception as e:
                  result["stage1_error"] = f"{type(e).__name__}: {str(e)}"
                  result["verdict"] = "FAIL - openpyxl import error"
                  return result

              # STAGE 2: Check rich text classes
              try:
                  from openpyxl.cell.text import InlineFont
                  try:
                      from openpyxl.cell.rich_text import CellRichText, TextBlock
                      result["stage2_rich_text_available"] = True
                  except ImportError:
                      try:
                          from openpyxl.cell.text import TextBlock
                          result["stage2_rich_text_available"] = True
                          result["stage2_error"] = "Using legacy TextBlock import path"
                      except ImportError as e:
                          result["stage2_error"] = f"TextBlock unavailable: {str(e)}"
              except Exception as e:
                  result["stage2_error"] = f"{type(e).__name__}: {str(e)}"

              # STAGE 3: Try writing XLSX with rich text + capture bytes
              try:
                  from openpyxl import Workbook
                  from openpyxl.styles import Font

                  wb = Workbook()
                  ws = wb.active
                  ws.title = "Eiken_Proofread_Test"

                  # Header row
                  headers = ["#", "Item ID", "Original", "Fixed (rich text)", "Errors"]
                  for col_idx, h in enumerate(headers, 1):
                      cell = ws.cell(row=1, column=col_idx, value=h)
                      cell.font = Font(bold=True)

                  # Sample row 1: simple cell with underline font
                  ws.cell(row=2, column=1, value=1)
                  ws.cell(row=2, column=2, value="E2-001")
                  ws.cell(row=2, column=3, value="I dont to read from a paper.")
                  ws.cell(row=2, column=4, value="I dont don't to read from a paper.")
                  # Apply underline to whole cell as fallback
                  ws.cell(row=2, column=4).font = Font(underline="single", color="FF0000")
                  ws.cell(row=2, column=5, value="dont → don't (grammar)")

                  # Sample row 2: try rich text if available
                  ws.cell(row=3, column=1, value=2)
                  ws.cell(row=3, column=2, value="E2-002")
                  ws.cell(row=3, column=3, value="She have a apple yesterday.")
                  if result["stage2_rich_text_available"]:
                      try:
                          from openpyxl.cell.text import InlineFont
                          from openpyxl.cell.rich_text import CellRichText, TextBlock
                          font_normal = InlineFont(rFont="Calibri", sz=11)
                          font_strike = InlineFont(rFont="Calibri", sz=11, strike=True, color="FF0000")
                          font_bold = InlineFont(rFont="Calibri", sz=11, b=True, color="0070C0")
                          rich = CellRichText([
                              TextBlock(font_normal, "She "),
                              TextBlock(font_strike, "have"),
                              TextBlock(font_normal, " "),
                              TextBlock(font_bold, "has"),
                              TextBlock(font_normal, " "),
                              TextBlock(font_strike, "a"),
                              TextBlock(font_normal, " "),
                              TextBlock(font_bold, "an"),
                              TextBlock(font_normal, " apple yesterday."),
                          ])
                          ws.cell(row=3, column=4).value = rich
                      except Exception as e:
                          ws.cell(row=3, column=4, value=f"[rich text fail: {e}]")
                  else:
                      ws.cell(row=3, column=4, value="She have→has a→an apple yesterday.")
                  ws.cell(row=3, column=5, value="have → has; a → an")

                  # Save to bytes
                  buf = io.BytesIO()
                  wb.save(buf)
                  file_bytes = buf.getvalue()
                  result["stage3_write_success"] = True
                  result["stage3_file_size_bytes"] = len(file_bytes)
                  # Return base64 in case end node can decode
                  encoded = base64.b64encode(file_bytes).decode("utf-8")
                  result["stage3_base64_preview"] = encoded[:200] + "...(truncated)"
                  result["stage3_base64_full"] = encoded
              except Exception as e:
                  result["stage3_error"] = f"{type(e).__name__}: {str(e)}"

              # Verdict
              if result["stage1_openpyxl_available"] and result["stage3_write_success"]:
                  if result["stage2_rich_text_available"]:
                      result["verdict"] = "PASS - openpyxl + rich text + write all work. Need to verify file return mechanism."
                  else:
                      result["verdict"] = "PARTIAL - openpyxl works but no rich text. Can use Font(underline) cell-level only."
              else:
                  result["verdict"] = "FAIL - check stage errors"

              return result
        outputs:
          stage1_openpyxl_available: { type: boolean, children: null }
          stage1_version: { type: string, children: null }
          stage1_error: { type: string, children: null }
          stage2_rich_text_available: { type: boolean, children: null }
          stage2_error: { type: string, children: null }
          stage3_write_success: { type: boolean, children: null }
          stage3_file_size_bytes: { type: number, children: null }
          stage3_base64_preview: { type: string, children: null }
          stage3_base64_full: { type: string, children: null }
          stage3_error: { type: string, children: null }
          verdict: { type: string, children: null }
        variables: []
      position: { x: 342, y: 280 }
      positionAbsolute: { x: 342, y: 280 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left

    - id: '1779200000003'
      type: custom
      data:
        title: 'Diagnostic Output'
        type: end
        outputs:
        - value_selector: ['1779200000002', verdict]
          value_type: string
          variable: verdict
        - value_selector: ['1779200000002', stage1_openpyxl_available]
          value_type: boolean
          variable: openpyxl_available
        - value_selector: ['1779200000002', stage1_version]
          value_type: string
          variable: openpyxl_version
        - value_selector: ['1779200000002', stage1_error]
          value_type: string
          variable: stage1_error
        - value_selector: ['1779200000002', stage2_rich_text_available]
          value_type: boolean
          variable: rich_text_available
        - value_selector: ['1779200000002', stage2_error]
          value_type: string
          variable: stage2_error
        - value_selector: ['1779200000002', stage3_write_success]
          value_type: boolean
          variable: write_success
        - value_selector: ['1779200000002', stage3_file_size_bytes]
          value_type: number
          variable: file_size_bytes
        - value_selector: ['1779200000002', stage3_base64_preview]
          value_type: string
          variable: base64_preview
        - value_selector: ['1779200000002', stage3_base64_full]
          value_type: string
          variable: base64_full
        - value_selector: ['1779200000002', stage3_error]
          value_type: string
          variable: stage3_error
      position: { x: 684, y: 280 }
      positionAbsolute: { x: 684, y: 280 }
      width: 241
      height: 200
      sourcePosition: right
      targetPosition: left

    viewport: { x: 0, y: 0, zoom: 0.8 }
