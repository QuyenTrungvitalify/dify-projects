    - id: '1778752604230'
      type: custom
      data:
        title: '10問づつバッチ分割'
        type: code
        code_language: python3
        code: |
          import csv
          import io
          import json

          PLACEHOLDER = "(          )"
          BATCH_SIZE = 10

          def clean(value):
              if value is None:
                  return ""
              s = str(value).replace("　", " ")
              s = s.replace("<br/>", "\n").replace("<br />", "\n").replace("<br>", "\n")
              s = (s.replace("&amp;", "&")
                    .replace("&lt;", "<")
                    .replace("&gt;", ">")
                    .replace("&quot;", '"')
                    .replace("&#39;", "'")
                    .replace("&#x27;", "'")
                    .replace("&apos;", "'"))
              return s.strip()

          def split_md_cells(line):
              s = line.strip()
              if s.startswith("|"):
                  s = s[1:]
              if s.endswith("|"):
                  s = s[:-1]
              return [c.strip() for c in s.split("|")]

          def parse_table_text(text):
              lines = [l for l in text.splitlines() if l.strip()]
              if not lines:
                  return [], "empty"
              if lines[0].lstrip().startswith("|"):
                  if len(lines) < 3:
                      return [], "markdown_too_short"
                  header = split_md_cells(lines[0])
                  rows = []
                  for line in lines[2:]:
                      if not line.lstrip().startswith("|"):
                          continue
                      cells = split_md_cells(line)
                      row = {header[i]: (cells[i] if i < len(cells) else "")
                             for i in range(len(header))}
                      rows.append(row)
                  return rows, "markdown"
              return list(csv.DictReader(io.StringIO(text))), "csv"

          def parse_row(row):
              row_no = clean(row.get("#"))
              item_id = clean(row.get("Item ID"))
              grade = clean(row.get("Grade"))
              category = clean(row.get("Category 1"))
              target = clean(row.get("Target"))
              stem = clean(row.get("Stem"))
              choices = [
                  clean(row.get("Answer Choice 1")),
                  clean(row.get("Answer Choice 2")),
                  clean(row.get("Answer Choice 3")),
                  clean(row.get("Answer Choice 4")),
              ]
              correct_raw = clean(row.get("Correct Answer Number"))
              correct = int(correct_raw) if correct_raw.isdigit() else 0
              return {
                  "row_no": row_no,
                  "item_id": item_id,
                  "grade": grade,
                  "category": category,
                  "target": target,
                  "stem": stem,
                  "choices": choices,
                  "correct": correct,
                  "has_placeholder": PLACEHOLDER in stem,
              }

          def main(text_list: list, mode: str) -> dict:
              text = text_list[0] if isinstance(text_list, list) else str(text_list)
              rows_raw, fmt = parse_table_text(text)
              items = []
              skipped = []
              for row in rows_raw:
                  item = parse_row(row)
                  items.append(item)
                  if not item["has_placeholder"]:
                      skipped.append({
                          "row_no": item["row_no"],
                          "item_id": item["item_id"],
                          "stem": item["stem"],
                      })
              # Pack mode into each batch so iteration sub-nodes can access it
              batches = []
              for i in range(0, len(items), BATCH_SIZE):
                  chunk = items[i:i + BATCH_SIZE]
                  batches.append(json.dumps({"items": chunk, "mode": mode}, ensure_ascii=False))
              return {
                  "batches": batches,
                  "batch_count": len(batches),
                  "item_count": len(items),
                  "skipped": json.dumps(skipped, ensure_ascii=False),
              }
        outputs:
          batches: { type: 'array[string]', children: null }
          batch_count: { type: number, children: null }
          item_count: { type: number, children: null }
          skipped: { type: string, children: null }
        variables:
        - value_selector: ['1778752604228', text]
          value_type: 'array[string]'
          variable: text_list
        - value_selector: ['1778752604226', mode]
          value_type: string
          variable: mode
