    - id: '1778752604235'
      type: custom
      data:
        title: 'バッチ展開 (10問→40文)'
        type: code
        code_language: python3
        isInIteration: true
        iteration_id: '1778752604233'
        code: |
          import json

          PLACEHOLDER = "(          )"

          def expand_choices(item):
              """1 question → 4 fulltext rows (1 per choice). No proofread yet —
              filled by either MOCK branch or DeepL branch downstream."""
              results = []
              stem = item["stem"]
              has_ph = item["has_placeholder"]
              for idx, choice in enumerate(item["choices"], 1):
                  if has_ph:
                      fulltext = stem.replace(PLACEHOLDER, choice)
                  else:
                      fulltext = stem
                  results.append({
                      "row_no": item["row_no"],
                      "item_id": item["item_id"],
                      "grade": item["grade"],
                      "category": item["category"],
                      "target": item["target"],
                      "stem": stem,
                      "choice_idx": idx,
                      "choice_text": choice,
                      "fulltext": fulltext,
                      "is_correct": (idx == item["correct"]),
                      "has_placeholder": has_ph,
                  })
              return results

          def main(batch_json: str) -> dict:
              data = json.loads(batch_json)
              items = data.get("items", [])
              mode = data.get("mode", "mock")
              all_results = []
              for item in items:
                  all_results.extend(expand_choices(item))
              return {
                  "expanded_json": json.dumps(all_results, ensure_ascii=False),
                  "fulltext_list_json": json.dumps(
                      [r["fulltext"] for r in all_results], ensure_ascii=False
                  ),
                  "mode": mode,
                  "expanded_count": len(all_results),
              }
        outputs:
          expanded_json: { type: string, children: null }
          fulltext_list_json: { type: string, children: null }
          mode: { type: string, children: null }
          expanded_count: { type: number, children: null }
        variables:
