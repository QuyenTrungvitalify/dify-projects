    - id: '1778836651680'
      type: custom
      data:
        title: 'DeepL レスポンス統合'
        type: code
        code_language: python3
        isInIteration: true
        iteration_id: '1778752604233'
        code: |
          import json

          def main(expanded_json: str, response_body: str, status_code: int) -> dict:
              """<<< VERIFY response shape against actual DeepL Write API >>>
              Assumed: { "improvements": [{"text": "..."}, ...] }"""
              items = json.loads(expanded_json)

              if status_code != 200:
                  marker = f"[API_ERROR_{status_code}]"
                  for it in items:
                      it["proofread"] = f"{marker} {it['fulltext']}"
                      it["api_ok"] = False
                  return {
                      "batch_results": json.dumps(items, ensure_ascii=False),
                      "batch_size": len(items),
                  }

              try:
                  data = json.loads(response_body)
                  improvements = data.get("improvements", [])
              except Exception:
                  improvements = []

              for idx, it in enumerate(items):
                  if idx < len(improvements) and isinstance(improvements[idx], dict):
                      it["proofread"] = improvements[idx].get("text", it["fulltext"])
                      it["api_ok"] = True
                  else:
                      it["proofread"] = it["fulltext"]
                      it["api_ok"] = False

              return {
                  "batch_results": json.dumps(items, ensure_ascii=False),
                  "batch_size": len(items),
              }
        outputs:
          batch_results: { type: string, children: null }
          batch_size: { type: number, children: null }
