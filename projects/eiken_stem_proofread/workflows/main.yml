# Eiken Stem Proofread — 84問校閲ワークフロー (v5 — 2-branch: MOCK / DeepL)
#
# Task: Excel 84問 → Stem に Answer Choice 1〜4 を入力 → 校閲 → CSV file download。
#
# Design: 1 workflow, 2 internal branches selected by `mode` input at Start.
#
#   mode=mock  → run [MOCK] prefix passthrough (no API, $0, fast — for testing/demo)
#   mode=deepl → call DeepL Write API via HTTP node (SKELETON — fill API spec first)
#
# Flow:
#   Start (xlsx + mode select)
#     → Document Extractor (xlsx → Markdown table)
#     → Code: Parse + split into batches (10 questions/batch)
#     → Iteration (parallel_nums=2)
#         ├─ Code: Expand (1 item → 4 fulltext rows, no proofread yet)
#         ├─ IF/ELSE: branch on `mode`
#         │     ├─[mode=deepl] → Code: Build payload → HTTP DeepL → Code: Merge response
#         │     └─[mode=mock]  → Code: Mock proofread ([MOCK] prefix)
#         └─ Variable Aggregator: merge batch_results from either branch
#     → Code: Aggregator (flatten + gen CSV text + Markdown)
#     → Tool: md_exporter (Markdown → CSV file)
#     → End
#
# Output:
#   - csv_file (array[file]) — clickable download
#   - row_count, total_items, skipped_items, api_errors — metadata
#
# ⚠️ DeepL branch is SKELETON — needs filling before mode=deepl works:
#   1. HTTP node URL — search `<<< FILL` in this file
#   2. Request body shape — Code "DeepL リクエスト構築" — verify against DeepL spec
#   3. Response shape — Code "レスポンス統合" — verify `improvements[i].text` field
#   4. Add env var DEEPL_API_KEY via Dify Studio (type: Secret)
#
# Migration path:
#   Phase 1 (NOW): mode=mock default. Demo to khách, no API needed.
#   Phase 2 (when DeepL spec arrives): fill 3 spots above, change Start `mode` default to deepl.
#   Phase 3 (after DeepL confirmed working): remove MOCK branch + if-else + aggregator → graph becomes linear.

