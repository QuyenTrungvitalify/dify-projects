    - id: '1778752604237'
      type: custom
      data:
        title: 'LONG CSV出力生成'
        type: code
        code_language: python3
        code: |
          import csv
          import io
          import json

          HEADER = [
              "#", "Item ID", "Grade", "Category", "Target",
              "Stem (template)",
              "Choice #", "Choice Text",
              "Full Text", "Proofread",
              "Is Correct", "Has Placeholder",
              "API OK",
          ]

          def md_escape(value):
              s = "" if value is None else str(value)
              return s.replace("|", "\\|").replace("\n", " ").replace("\r", " ")

          def build_row_values(d):
              return [
                  d.get("row_no", ""),
                  d.get("item_id", ""),
                  d.get("grade", ""),
                  d.get("category", ""),
                  d.get("target", ""),
                  d.get("stem", ""),
                  d.get("choice_idx", ""),
                  d.get("choice_text", ""),
                  d.get("fulltext", ""),
                  d.get("proofread", ""),
                  "Y" if d.get("is_correct") else "",
                  "Y" if d.get("has_placeholder") else "",
                  "Y" if d.get("api_ok", True) else "N",
              ]

          def main(batch_results_list: list) -> dict:
              flat = []
              for r in batch_results_list:
                  if not r:
                      continue
                  try:
                      batch = json.loads(r)
                      flat.extend(batch)
                  except Exception:
                      continue

              buf = io.StringIO()
              writer = csv.writer(buf, quoting=csv.QUOTE_MINIMAL, lineterminator="\n")
              writer.writerow(HEADER)
              for d in flat:
                  writer.writerow(build_row_values(d))
              csv_text = "﻿" + buf.getvalue()

              md_lines = [
                  "| " + " | ".join(HEADER) + " |",
                  "|" + "|".join(["---"] * len(HEADER)) + "|",
              ]
              for d in flat:
                  cells = [md_escape(c) for c in build_row_values(d)]
                  md_lines.append("| " + " | ".join(cells) + " |")
              csv_markdown = "\n".join(md_lines)

              api_error_count = sum(1 for d in flat if not d.get("api_ok", True))

              return {
                  "csv_text": csv_text,
                  "csv_markdown": csv_markdown,
                  "row_count": len(flat),
                  "api_error_count": api_error_count,
              }
        outputs:
          csv_text: { type: string, children: null }
          csv_markdown: { type: string, children: null }
          row_count: { type: number, children: null }
          api_error_count: { type: number, children: null }
        variables:
        - value_selector: ['1778752604233', output]
          value_type: 'array[string]'
          variable: batch_results_list
      position: { x: 3150, y: 280 }
      positionAbsolute: { x: 3150, y: 280 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left

