# Eiken Stem Proofread — v2 (LanguageTool, 2-mode free|premium)
#
# Spec: projects/eiken_stem_proofread/spec_todo/spec_change_v2.md (locked 2026-05-21, updated 2026-06-02)
#
# Diff vs main.yml (v5 DeepL skeleton):
#   - API:        DeepL → LanguageTool (endpoint api.languagetoolplus.com/v2/check)
#   - Tier:       mock|deepl → free|premium (placeholder env vars)
#   - Stem fill:  4 choices → 1 fulltext (uses Correct Answer Number only)
#   - No-placeholder rows: treated as data defect, dropped (was passed through)
#   - Output rows: every valid stem is emitted; no-error rows have empty Errors + Count=0
#                  (spec update 2026-06-02 — previously: filter to matches only)
#   - Output:     CSV (long, 13 cols) → XLSX (long, 6 cols Y1 multi-column)
#   - Iteration:  9 batches × 10 items → 84 items × 1 item, parallel_nums 2→1
#
# Flow:
#   Start (file + mode=free|premium)
#     → Document Extractor
#     → データ正規化 (parse + drop no-placeholder + pre-fill fulltext, output array[string] of N items)
#     → Iteration [parallel=1, ≤84 items]
#         ├─ アイテム解析 (split item JSON → fulltext + meta_json passthrough)
#         ├─ IF/ELSE on start.mode == "premium"
#         │     ├─[true]  LT Premium HTTP (POST, x-www-form-urlencoded, auth via env)
#         │     │           → LT 統合 (Premium) → drops rows without matches
#         │     └─[false] LT Free HTTP   (POST, x-www-form-urlencoded, no auth)
#         │                 → LT 統合 (Free)    → drops rows without matches
#         └─ Variable Aggregator: merge per-item result (JSON or "" sentinel)
#     → LONG TABLE出力生成 (filter empties + build 6-col Y1 markdown)
#     → Tool md_to_xlsx (Markdown table → .xlsx)
#     → End (xlsx_file)
#
# Compliance note (Japanese): Free モードは LT 利用規約により自動リクエスト禁止 → テスト・開発専用。
# 本番運用は Premium 必須 — UI に warning text + Start node hint で警告。
#
# Phase 1 (NOW): KH chạy Free mode test với env vars empty.
# Phase 2: KH subscribe Premium → fill LT_USERNAME + LT_API_KEY env vars → switch mode select.

