      type: custom
      data:
        title: 'データ正規化 (filter + pre-fill)'
        type: code
        code_language: python3
        code: |
          import csv
          import io
          import json

          PLACEHOLDER = "(          )"

          def clean(value):
              if value is None:
                  return ""
              s = str(value).replace("　", " ")
              s = s.replace("<br/>", "\n").replace("<br />", "\n").replace("<br>", "\n")
              s = (s.replace("&amp;", "&")
                    .replace("&lt;", "<")
                    .replace("&gt;", ">")
                    .replace("&quot;", '"')
                    .replace("&#39;", "'")
                    .replace("&#x27;", "'")
                    .replace("&apos;", "'"))
              return s.strip()

          def split_md_cells(line):
              s = line.strip()
              if s.startswith("|"):
                  s = s[1:]
              if s.endswith("|"):
                  s = s[:-1]
              return [c.strip() for c in s.split("|")]

          def parse_table_text(text):
              lines = [l for l in text.splitlines() if l.strip()]
              if not lines:
                  return []
              if lines[0].lstrip().startswith("|"):
                  if len(lines) < 3:
                      return []
                  header = split_md_cells(lines[0])
                  rows = []
                  for line in lines[2:]:
                      if not line.lstrip().startswith("|"):
                          continue
                      cells = split_md_cells(line)
                      row = {header[i]: (cells[i] if i < len(cells) else "")
                             for i in range(len(header))}
                      rows.append(row)
                  return rows
              return list(csv.DictReader(io.StringIO(text)))

          def normalize_row(row):
              """Parse 1 row + fill correct-choice into stem.
              Returns dict on success; None if data defect (no placeholder, missing correct index, etc.)."""
              stem = clean(row.get("Stem"))
              if not stem or PLACEHOLDER not in stem:
                  return None  # data defect: no placeholder → drop per spec
              correct_raw = clean(row.get("Correct Answer Number"))
              if not correct_raw.isdigit():
                  return None
              correct = int(correct_raw)
              if not 1 <= correct <= 4:
                  return None
              choices = [
                  clean(row.get("Answer Choice 1")),
                  clean(row.get("Answer Choice 2")),
                  clean(row.get("Answer Choice 3")),
                  clean(row.get("Answer Choice 4")),
              ]
              correct_text = choices[correct - 1]
              fulltext = stem.replace(PLACEHOLDER, correct_text)
              return {
                  "row_no": clean(row.get("#")),
                  "item_id": clean(row.get("Item ID")),
                  "grade": clean(row.get("Grade")),
                  "category": clean(row.get("Category 1")),
                  "target": clean(row.get("Target")),
                  "stem": stem,
                  "correct": correct,
                  "correct_text": correct_text,
                  "fulltext": fulltext,
              }

          def main(text_list: list) -> dict:
              text = text_list[0] if isinstance(text_list, list) else str(text_list)
              raw_rows = parse_table_text(text)
              items = []
              skipped = []
              for row in raw_rows:
                  norm = normalize_row(row)
                  if norm is None:
                      skipped.append({
                          "row_no": clean(row.get("#")),
                          "item_id": clean(row.get("Item ID")),
                          "stem": clean(row.get("Stem")),
                          "reason": "no-placeholder-or-invalid-correct",
                      })
                  else:
                      items.append(json.dumps(norm, ensure_ascii=False))
              return {
                  "items": items,
                  "item_count": len(items),
                  "skipped_count": len(skipped),
                  "skipped": json.dumps(skipped, ensure_ascii=False),
              }
        outputs:
          items: { type: 'array[string]', children: null }
          item_count: { type: number, children: null }
          skipped_count: { type: number, children: null }
          skipped: { type: string, children: null }
        variables:
        - value_selector: ['1778752604228', text]
          value_type: 'array[string]'
          variable: text_list
