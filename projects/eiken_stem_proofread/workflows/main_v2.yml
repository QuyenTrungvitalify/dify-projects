    - id: '1778752604237'
      type: custom
      data:
        title: 'LONG TABLE出力生成 (Y1 6-col)'
        type: code
        code_language: python3
        code: |
          import json

          HEADER = ["#", "Item ID", "Original", "Fixed (clean)", "Errors", "Error Count"]

          def md_escape(value):
              s = "" if value is None else str(value)
              # Pipe + newline break Markdown tables; replace with safe equivalents.
              return s.replace("|", "\\|").replace("\n", " ").replace("\r", " ")

          def main(results: list) -> dict:
              kept = []
              api_error_count = 0
              for raw in results:
                  if not raw:
                      continue  # safety net: iteration failure (continue-on-error)
                  try:
                      item = json.loads(raw)
                  except Exception:
                      continue
                  if not item.get("keep"):
                      continue
                  if not item.get("api_ok", True):
                      api_error_count += 1
                  kept.append(item)

              lines = [
                  "| " + " | ".join(HEADER) + " |",
                  "|" + "|".join(["---"] * len(HEADER)) + "|",
              ]
              for idx, item in enumerate(kept, 1):
                  row = [
                      str(idx),
                      item.get("item_id", ""),
                      item.get("fulltext", ""),
                      item.get("fixed", ""),
                      item.get("errors", ""),
                      str(item.get("count", 0)),
                  ]
                  lines.append("| " + " | ".join(md_escape(c) for c in row) + " |")
              table_markdown = "\n".join(lines)

              return {
                  "table_markdown": table_markdown,
                  "row_count": len(kept),
                  "api_error_count": api_error_count,
              }
        outputs:
          table_markdown: { type: string, children: null }
          row_count: { type: number, children: null }
          api_error_count: { type: number, children: null }
        variables:
        - value_selector: ['1778752604233', output]
          value_type: 'array[string]'
          variable: results
      position: { x: 3150, y: 280 }
      positionAbsolute: { x: 3150, y: 280 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left

