    - id: '1778836651680'
      type: custom
      data:
        title: 'LT 統合 (Premium)'
        type: code
        code_language: python3
        isInIteration: true
        iteration_id: '1778752604233'
        code: |
          import json

          CONFIDENCE_THRESHOLD = 0.5

          # Skip noise that Eiken proofreaders don't care about:
          # - locale-violation: BrE/AmE spelling variants (mom↔mum, color↔colour)
          # - typographical:    typography preferences (cafe↔café, smart quotes)
          # These often slip through even when `language` matches content because LT's
          # tagging is inconsistent. To expose this as a UI knob later, lift into a
          # Start-node select and pass through meta_json. For now: hardcoded.
          SKIP_ISSUE_TYPES = {"locale-violation", "typographical"}
          SKIP_RULE_CATEGORIES = {"TYPOGRAPHY"}

          def is_relevant_match(m):
              rule = m.get("rule") or {}
              if rule.get("issueType") in SKIP_ISSUE_TYPES:
                  return False
              category = (rule.get("category") or {}).get("id")
              if category in SKIP_RULE_CATEGORIES:
                  return False
              return True

          def build_errors_column(fulltext, matches):
              """Build 'word → suggestion (type)' per match.
              When LT has no suggestion (e.g. complex tense error), fall back to
              LT's message field so KH has context to fix manually."""
              parts = []
              for m in matches:
                  off = m.get("offset", 0)
                  ln = m.get("length", 0)
                  original_word = fulltext[off:off + ln]
                  replacements = m.get("replacements") or []
                  rule = m.get("rule") or {}
                  issue_type = rule.get("issueType", "unknown")

                  if replacements:
                      suggestion = replacements[0]["value"]
                      parts.append(f"{original_word} → {suggestion} ({issue_type})")
                  else:
                      # No auto-suggestion — surface LT's explanation message.
                      # Truncate to 80 chars to keep cell readable.
                      msg = (m.get("message") or "").strip()
                      if msg:
                          if len(msg) > 80:
                              msg = msg[:77] + "..."
                          parts.append(f"{original_word} ⚠ {msg} ({issue_type})")
                      else:
                          parts.append(f"{original_word} (no suggestion) ({issue_type})")
              return "; ".join(parts)

          def build_fixed_text(fulltext, matches):
              # Sort by offset DESC so earlier replacements don't shift later offsets.
              ordered = sorted(matches, key=lambda x: x.get("offset", 0), reverse=True)
              result = fulltext
              for m in ordered:
                  replacements = m.get("replacements") or []
                  if not replacements:
                      continue
                  start = m.get("offset", 0)
                  end = start + m.get("length", 0)
                  result = result[:start] + replacements[0]["value"] + result[end:]
              return result

          def main(meta_json: str, response_body: str, status_code) -> dict:
              meta = json.loads(meta_json)
              fulltext = meta.get("fulltext", "")
              try:
                  code = int(status_code)
              except (TypeError, ValueError):
                  code = 0

              if code != 200:
                  return {
                      "output": json.dumps({
                          "keep": True,
                          "row_no": meta.get("row_no", ""),
                          "item_id": meta.get("item_id", ""),
                          "fulltext": fulltext,
                          "fixed": fulltext,
                          "errors": f"[API_ERROR_{code}]",
                          "count": 0,
                          "api_ok": False,
                      }, ensure_ascii=False),
                  }

              try:
                  data = json.loads(response_body or "{}")
              except Exception:
                  data = {}
              matches = data.get("matches", []) or []
              # Confidence filter first (drop low-confidence matches)
              matches = [m for m in matches
                         if (m.get("rule") or {}).get("confidence", 1.0) >= CONFIDENCE_THRESHOLD]
              # Noise filter: drop locale-variant and typography matches
              matches = [m for m in matches if is_relevant_match(m)]

              # Spec 2026-06-02: emit every item, including no-error rows.
              # No-error rows have fixed = fulltext, errors = "", count = 0.
              return {
