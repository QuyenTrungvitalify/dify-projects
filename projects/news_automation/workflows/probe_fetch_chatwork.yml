    - id: '1781160126478'
      type: custom
      data:
        title: 'Parse File Messages'
        desc: 'Regex extract file_id + build URLs + filter last N hours'
        type: code
        code_language: python3
        code: |
          import json
          import re
          import time

          PATTERN = re.compile(r"\[download:(\d+)\]([^\[]*)\[/download\]")

          def main(messages_json, room_id, hours_back) -> dict:
              if not messages_json:
                  return {"file_urls": [], "count": 0, "error": "messages_json is empty", "total_messages": 0, "in_window": 0, "sample_bodies": []}
              if not room_id:
                  return {"file_urls": [], "count": 0, "error": "room_id is empty", "total_messages": 0, "in_window": 0, "sample_bodies": []}

              try:
                  hours = int(str(hours_back).strip()) if hours_back else 24
              except (ValueError, TypeError):
                  hours = 24

              cutoff = int(time.time()) - hours * 3600

              try:
                  messages = json.loads(messages_json)
              except json.JSONDecodeError as e:
                  return {"file_urls": [], "count": 0, "error": f"JSON decode failed: {e}. First 200 chars: {messages_json[:200]}", "total_messages": 0, "in_window": 0, "sample_bodies": []}

              if not isinstance(messages, list):
                  return {"file_urls": [], "count": 0, "error": f"Expected list, got {type(messages).__name__}: {str(messages)[:200]}", "total_messages": 0, "in_window": 0, "sample_bodies": []}

              total = len(messages)
              urls = []
              in_window = 0
              unmatched_bodies = []

              for msg in messages:
                  if not isinstance(msg, dict):
                      continue
                  body = msg.get("body") or ""
                  send_time = msg.get("send_time") or 0
                  try:
                      send_time = int(send_time)
                  except (ValueError, TypeError):
                      send_time = 0
                  if send_time < cutoff:
                      continue
                  in_window += 1
                  matches = list(PATTERN.finditer(body))
                  if not matches:
                      if len(unmatched_bodies) < 10:
                          unmatched_bodies.append(body[:500])
                      continue
                  for m in matches:
                      file_id = m.group(1)
                      urls.append(f"https://api.chatwork.com/v2/rooms/{room_id}/files/{file_id}?create_download_url=1")

              return {
                  "file_urls": urls,
                  "count": len(urls),
                  "error": "",
                  "total_messages": total,
                  "in_window": in_window,
                  "sample_bodies": unmatched_bodies,
              }
        outputs:
          file_urls: { type: 'array[string]', children: null }
          count: { type: number, children: null }
          error: { type: string, children: null }
          total_messages: { type: number, children: null }
          in_window: { type: number, children: null }
          sample_bodies: { type: 'array[string]', children: null }
        variables:
        - value_selector: ['1781160126476', body]
          value_type: string
          variable: messages_json
        - value_selector: ['1781160126474', room_id]
          value_type: string
          variable: room_id
        - value_selector: ['1781160126474', hours_back]
          value_type: string
          variable: hours_back
