        desc: 'LLM Vision via Dify provider config — zero key in workflow. Consumes HTTP3.files as image input.'
        type: llm
        isInIteration: true
        iteration_id: '1781160126480'
        model:
          provider: langgenius/openai/openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.2
            max_tokens: 1500
            response_format: json_object
        prompt_template:
        - id: ocr-system-001
          role: system
          text: |-
            あなたはAI/DX関連ニュース記事のスクリーンショットからメタデータを抽出する専門アシスタントです。
            出力は必ず JSON 形式で、以下の4つのキーのみを含めてください：
            - title: 記事の見出し（最も大きく/太字で表示されているタイトル1行のみ。本文や説明文は含めない。100文字以内）
            - source_url: 画像内に明示的に表示されているソースURL文字列（推測禁止、見えない場合は空文字列 ""）
            - summary: 本文の要約 2〜3文（日本語、120文字以内）
            - raw_text: 画像内で読み取れる本文テキスト全文（タイトル以外の段落部分、改行はスペースに置換）

            ルール:
            - 推測しない、画像から読み取れる情報のみ
            - title は1行の見出しのみ、長い段落を含めない
            - 画像が判読不能な場合は title: "", summary: "", raw_text: "", source_url: ""
            - 他のテキストや説明を追加しない、JSON のみ
        - id: ocr-user-001
          role: user
          text: '次の画像から上記4項目を抽出してください。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: true
          configs:
            detail: high
            variable_selector:
            - '1781183383883'
            - files
        variables: []
