    - id: '1781160126485'
      type: custom
      data:
        title: 'Wrap Record'
        desc: 'Combine file + OCR results into JSON record'
        type: code
        code_language: python3
        isInIteration: true
        iteration_id: '1781160126480'
        code: |
          import json

          def main(iter_item, file_status, download_url, filename, extract_error,
                   download_status, ocr_text) -> dict:
              def _int(v):
                  try:
                      return int(v) if v is not None else 0
                  except (ValueError, TypeError):
                      return 0

              ocr_payload = None
              ocr_error = ""
              if ocr_text:
                  try:
                      ocr_payload = json.loads(ocr_text)
                  except json.JSONDecodeError:
                      ocr_payload = {"raw_content": ocr_text[:1000]}
                      ocr_error = "LLM output not valid JSON"

              record = {
                  "chatwork_file_url": iter_item or "",
                  "filename": filename or "",
                  "download_url": download_url or "",
                  "file_status": _int(file_status),
                  "extract_error": extract_error or "",
                  "download_status": _int(download_status),
                  "ocr_error": ocr_error,
                  "ocr": ocr_payload,
              }
              return {"result": json.dumps(record, ensure_ascii=False)}
        outputs:
          result: { type: string, children: null }
        variables:
        - value_selector: ['1781160126480', item]
          value_type: string
          variable: iter_item
        - value_selector: ['1781160126483', status_code]
          value_type: number
          variable: file_status
