    - id: '1781160126485'
      type: custom
      data:
        title: 'A3.5: Wrap OCR Record'
        desc: 'Combine OCR + metadata into JSON record'
        type: code
        code_language: python3
        isInIteration: true
        iteration_id: '1781160126480'
        code: |
          import json
          def main(iter_item, download_url, filename, ocr_text, file_status, download_status) -> dict:
              def _int(v):
                  try:
                      return int(v) if v is not None else 0
                  except (ValueError, TypeError):
                      return 0
              ocr_payload = None
              ocr_error = ""
              if ocr_text:
                  try:
                      ocr_payload = json.loads(ocr_text)
                  except json.JSONDecodeError:
                      ocr_payload = {"raw_content": ocr_text[:500]}
                      ocr_error = "LLM not JSON"
              record = {
                  "source": "chatwork",
                  "chatwork_file_url": iter_item or "",
                  "filename": filename or "",
                  "download_url": download_url or "",
                  "file_status": _int(file_status),
                  "download_status": _int(download_status),
                  "ocr_error": ocr_error,
                  "ocr": ocr_payload,
              }
              return {"result": json.dumps(record, ensure_ascii=False)}
        outputs:
          result: { type: string, children: null }
        variables:
        - value_selector: ['1781160126480', item]
          value_type: string
          variable: iter_item
        - value_selector: ['1781170608079', download_url]
          value_type: string
          variable: download_url
        - value_selector: ['1781170608079', filename]
