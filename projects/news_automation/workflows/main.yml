    # ============================================================
    # SECTION C2: Sort + Top N
    # ============================================================
    - id: '1781245558333'
      type: custom
      data:
        title: 'E: Sort + Top 2'
        desc: 'Sort by composite score desc, take top 2'
        type: code
        code_language: python3
        code: |
          import json
          TOP_N = 2
          def main(scored_items) -> dict:
              parsed = []
              for s in scored_items or []:
                  if not s:
                      continue
                  try:
                      parsed.append(json.loads(s))
                  except json.JSONDecodeError:
                      continue
              # Partition by source: chatwork content is user-curated → always prioritize
              chatwork = [a for a in parsed if a.get("source") == "chatwork"]
              rss = [a for a in parsed if a.get("source") != "chatwork"]
              # Sort each group by composite score desc
              chatwork.sort(key=lambda x: x.get("_score_composite", 0), reverse=True)
              rss.sort(key=lambda x: x.get("_score_composite", 0), reverse=True)
              # Take all chatwork first (up to TOP_N), then fill remaining slots with best RSS
              top = chatwork[:TOP_N]
              if len(top) < TOP_N:
                  top.extend(rss[:TOP_N - len(top)])
              return {
                  "top_articles": [json.dumps(x, ensure_ascii=False) for x in top],
                  "top_count": len(top),
                  "total_scored": len(parsed),
                  "chatwork_in_pool": len(chatwork),
                  "rss_in_pool": len(rss),
              }
        outputs:
          top_articles: { type: 'array[string]', children: null }
          top_count: { type: number, children: null }
          total_scored: { type: number, children: null }
          chatwork_in_pool: { type: number, children: null }
          rss_in_pool: { type: number, children: null }
        variables:
