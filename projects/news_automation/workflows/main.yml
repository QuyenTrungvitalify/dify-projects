    - id: '1781160126478'
      type: custom
      data:
        title: 'A2: Parse File Messages'
        desc: 'Regex extract download URLs from message bodies'
        type: code
        code_language: python3
        code: |
          import json
          import re
          import time

          PATTERN = re.compile(r"\[download:(\d+)\]([^\[]*)\[/download\]")

          def main(messages_json, room_id, hours_back) -> dict:
              if not messages_json:
                  return {"file_urls": [], "count": 0, "error": "messages_json empty"}
              if not room_id:
                  return {"file_urls": [], "count": 0, "error": "room_id empty"}
              try:
                  hours = int(str(hours_back).strip()) if hours_back else 24
              except (ValueError, TypeError):
                  hours = 24
              cutoff = int(time.time()) - hours * 3600
              try:
                  messages = json.loads(messages_json)
              except json.JSONDecodeError as e:
                  return {"file_urls": [], "count": 0, "error": f"JSON decode: {e}"}
              if not isinstance(messages, list):
                  return {"file_urls": [], "count": 0, "error": f"Expected list, got {type(messages).__name__}"}

              urls = []
              for msg in messages:
                  if not isinstance(msg, dict):
                      continue
                  body = msg.get("body") or ""
                  send_time = msg.get("send_time") or 0
                  try:
                      send_time = int(send_time)
                  except (ValueError, TypeError):
                      send_time = 0
                  if send_time < cutoff:
                      continue
                  for m in PATTERN.finditer(body):
                      file_id = m.group(1)
                      urls.append(f"https://api.chatwork.com/v2/rooms/{room_id}/files/{file_id}?create_download_url=1")
              return {"file_urls": urls, "count": len(urls), "error": ""}
        outputs:
          file_urls: { type: 'array[string]', children: null }
          count: { type: number, children: null }
          error: { type: string, children: null }
        variables:
        - value_selector: ['1781160126476', body]
          value_type: string
          variable: messages_json
        - value_selector: ['1781160126474', room_id]
          value_type: string
          variable: room_id
        - value_selector: ['1781160126474', hours_back]
          value_type: string
          variable: hours_back
