    # ============================================================
    # MERGE + DEDUP
    # ============================================================
    - id: '1781245558324'
      type: custom
      data:
        title: 'C: Merge + Dedup'
        desc: 'Concat Chatwork + RSS arrays, dedup by normalized URL'
        type: code
        code_language: python3
        code: |
          import json

          TRACKER_PARAMS = {"utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "ref", "fbclid", "gclid"}

          def _normalize(url: str) -> str:
              if not url:
                  return ""
              s = url.strip()
              # Drop fragment
              if "#" in s:
                  s = s.split("#", 1)[0]
              # Filter query params
              if "?" in s:
                  base, query = s.split("?", 1)
                  kept = []
                  for kv in query.split("&"):
                      if not kv:
                          continue
                      k = kv.split("=", 1)[0].lower()
                      if k not in TRACKER_PARAMS:
                          kept.append(kv)
                  s = base + ("?" + "&".join(kept) if kept else "")
              # Strip trailing slash from path
              if s.endswith("/") and s.count("/") > 2:
                  s = s.rstrip("/")
              # Lowercase scheme + host
              if "://" in s:
                  scheme, rest = s.split("://", 1)
                  if "/" in rest:
                      host, path = rest.split("/", 1)
                      s = scheme.lower() + "://" + host.lower() + "/" + path
                  else:
                      s = scheme.lower() + "://" + rest.lower()
              return s

          def main(chatwork_items, rss_items) -> dict:
              combined = []
              combined.extend(chatwork_items or [])
              combined.extend(rss_items or [])

              seen = set()
              unique = []
              dropped_dup = 0
              for s in combined:
                  if not s:
                      continue
                  try:
                      obj = json.loads(s)
                  except json.JSONDecodeError:
                      continue
                  key = _normalize(obj.get("source_url") or "") or obj.get("title", "")
                  if not key:
                      continue
                  if key in seen:
                      dropped_dup += 1
                      continue
                  seen.add(key)
                  obj["_dedup_key"] = key
                  unique.append(json.dumps(obj, ensure_ascii=False))

              # Cap at 28 (Dify array output limit is 30); preserve original count in total_out
              capped = unique[:28]
              return {
                  "deduped": capped,
                  "total_in": len(combined),
                  "total_out": len(unique),
                  "total_capped": len(capped),
                  "dropped_dup": dropped_dup,
              }
        outputs:
          deduped: { type: 'array[string]', children: null }
          total_in: { type: number, children: null }
          total_out: { type: number, children: null }
          total_capped: { type: number, children: null }
          dropped_dup: { type: number, children: null }
        variables:
        - value_selector: ['1781245558311', unified]
          value_type: 'array[string]'
          variable: chatwork_items
        - value_selector: ['1781245558315', output]
          value_type: 'array[string]'
          variable: rss_items
      position: { x: 2740, y: 400 }
      positionAbsolute: { x: 2740, y: 400 }
      width: 242
      height: 100
      sourcePosition: right
      targetPosition: left

