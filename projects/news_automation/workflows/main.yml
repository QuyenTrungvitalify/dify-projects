                  if not title and not summary and not raw_text:
                      continue
                  unified.append(json.dumps({
                      "source": "chatwork",
                      "title": title or "(no title)",
                      "source_url": src_url,
                      "description": summary or raw_text[:200],
                      "filename": rec.get("filename", ""),
                  }, ensure_ascii=False))
