    - id: '1781245558320'
      type: custom
      data:
        title: 'B2.2: Parse Search Results'
        desc: 'Extract {title, url, snippet} from Google Search tool output → array[string] JSON'
        type: code
        code_language: python3
        isInIteration: true
        iteration_id: '1781245558315'
        code: |
          import json

          def _try_parse(value):
              if isinstance(value, str):
                  text = value.strip()
                  if not text:
                      return None
                  try:
                      return json.loads(text)
                  except json.JSONDecodeError:
                      return text
              return value

          def _extract_results(value):
              v = _try_parse(value)
              if v is None:
                  return []
              if isinstance(v, list):
                  out = []
                  for x in v:
                      if isinstance(x, dict):
                          # Dive into nested organic_results if present
                          if "organic_results" in x and isinstance(x["organic_results"], list):
                              out.extend(x["organic_results"])
                          else:
                              out.append(x)
                      elif isinstance(x, str):
                          p = _try_parse(x)
                          if isinstance(p, dict):
                              out.append(p)
                  return out
              if isinstance(v, dict):
                  for key in ("organic_results", "results", "items", "data", "value"):
                      if key in v and isinstance(v[key], list):
                          return v[key]
                  return [v]
              return []

          def _clean(s):
              return " ".join(str(s or "").split())

          def _domain(url: str) -> str:
              if not url:
                  return ""
              s = url
              if "://" in s:
                  s = s.split("://", 1)[1]
              if "/" in s:
                  s = s.split("/", 1)[0]
              return s.replace("www.", "")[:50]

          def main(search_result, query) -> dict:
              raw = _extract_results(search_result)
              items = []
              for r in raw:
                  if not isinstance(r, dict):
                      continue
                  title = _clean(r.get("title") or r.get("name") or "")
                  url = _clean(r.get("url") or r.get("link") or r.get("href") or "")
                  snippet = _clean(r.get("snippet") or r.get("description") or r.get("body") or r.get("text") or "")
                  if not url:
                      continue
                  items.append(json.dumps({
                      "source": _domain(url) or "google_search",
                      "title": title[:200],
                      "source_url": url,
                      "description": snippet[:300],
                      "published_at": _clean(r.get("date") or ""),
                      "_query": (query or "")[:120],
                  }, ensure_ascii=False))
              # Cap per query at 9 so flattened across 3 queries stays <30 (Dify array output limit)
              return {"items": items[:9], "feed_error": "" if items else "no items matched"}
        outputs:
          items: { type: 'array[string]', children: null }
          feed_error: { type: string, children: null }
        variables:
        - value_selector: ['1781245558317', json]
          value_type: 'array[object]'
          variable: search_result
        - value_selector: ['1781245558315', item]
          value_type: string
          variable: query
      parentId: '1781245558315'
      extent: parent
      position: { x: 360, y: 96 }
