        code: |
          import json

          def _esc(s: str) -> str:
              # Minimal HTML escape: avoid breaking tags. Order matters (& first).
              return (str(s or "")
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;"))

          def main(article_json, draft_json) -> dict:
              try:
                  art = json.loads(article_json) if article_json else {}
              except json.JSONDecodeError:
                  art = {}
              polished_title = art.get("title", "")
              polished_desc = art.get("description", "")
              if draft_json:
                  try:
                      d = json.loads(draft_json)
                      polished_title = d.get("polished_title") or polished_title
                      polished_desc = d.get("polished_description") or polished_desc
                  except json.JSONDecodeError:
                      pass
              url = art.get("source_url", "")
              source = art.get("source", "")
              # WordPress-ready HTML snippet (h2 + p + cite + source link)
              parts = [f"<h2>{_esc(polished_title)}</h2>", f"<p>{_esc(polished_desc)}</p>"]
              if url:
                  parts.append(f'<p>Source: <a href="{_esc(url)}" rel="nofollow noopener" target="_blank">{_esc(source) or _esc(url)}</a></p>')
              elif source:
                  parts.append(f'<p>Source: {_esc(source)}</p>')
              html = "\n".join(parts)
              row = {
                  "title": polished_title,
                  "url": url,
                  "source": source,
                  "description": polished_desc,
                  "html": html,
                  "_score": art.get("_score_composite", 0),
              }
              return {"row": json.dumps(row, ensure_ascii=False)}
        outputs:
          row: { type: string, children: null }
        variables:
        - value_selector: ['1781245558335', item]
          value_type: string
          variable: article_json
        - value_selector: ['1781245558338', text]
          value_type: string
          variable: draft_json
      parentId: '1781245558335'
      extent: parent
