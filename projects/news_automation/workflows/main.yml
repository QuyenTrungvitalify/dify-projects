    # ============================================================
    # PARSE SHEET RESPONSE — extract clean fields
    # ============================================================
    - id: '1781248954086'
      type: custom
      data:
        title: 'I: Parse Sheet Response'
        desc: 'Extract clean sheet_url + success from Apps Script JSON'
        type: code
        code_language: python3
        code: |
          import json
          def main(http_body) -> dict:
              success = False
              sheet_url = ""
              written = 0
              error_msg = ""
              if http_body:
                  try:
                      data = json.loads(http_body)
                      success = bool(data.get("success", False))
                      sheet_url = str(data.get("sheet_url") or "").strip()
                      written = int(data.get("written", 0)) if isinstance(data.get("written"), (int, float)) else 0
                      error_msg = str(data.get("error") or "")
                  except (json.JSONDecodeError, ValueError, TypeError):
                      error_msg = "non-JSON response: " + str(http_body)[:200]
              return {
                  "success": success,
                  "sheet_url": sheet_url,
                  "written": written,
                  "error_msg": error_msg,
              }
        outputs:
          success: { type: boolean, children: null }
          sheet_url: { type: string, children: null }
          written: { type: number, children: null }
          error_msg: { type: string, children: null }
