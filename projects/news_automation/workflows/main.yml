    # ============================================================
    # SECTION E: Write to Sheet
    # ============================================================
    - id: '1781245558342'
      type: custom
      data:
        title: 'G: Build Sheet Payload'
        desc: 'Wrap rows array into Apps Script webhook body'
        type: code
        code_language: python3
        code: |
          import json
          from datetime import datetime, timezone
          def main(rows_in) -> dict:
              rows = []
              for s in rows_in or []:
                  if not s:
                      continue
                  try:
                      r = json.loads(s)
                  except json.JSONDecodeError:
                      continue
                  rows.append({
                      "date": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
                      "title": r.get("title", ""),
                      "url": r.get("url", ""),
                      "source": r.get("source", ""),
                      "description": r.get("description", ""),
                      "html": r.get("html", ""),
                  })
              return {
                  "payload_json": json.dumps({"rows": rows}, ensure_ascii=False),
                  "row_count": len(rows),
              }
        outputs:
          payload_json: { type: string, children: null }
          row_count: { type: number, children: null }
        variables:
        - value_selector: ['1781245558335', output]
          value_type: 'array[string]'
          variable: rows_in
