name: ci

on:
  push:
    # Spec 081: `contrib/**` push-triggers CI because the contrib PR is opened by contrib-pr.yml
    # with GITHUB_TOKEN, and token-created PRs never trigger `pull_request` workflows (GitHub's
    # anti-recursion rule). Running on the contributor's own push attaches the checks to the PR
    # via the head SHA — same coverage, no PAT.
    branches: [main, 'contrib/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install Python deps
        # Single pinned source of truth (requirements.txt, locked from requirements.in, spec 024 Q1b).
        # Must come before setup.sh --skip-venv: the index rebuild uses system Python.
        run: uv pip install --system -r requirements.txt

      - name: Bootstrap workspace
        # Clones vendor/dify-src/ at .dify-tag plus skills/corpus.
        # --skip-venv: CI uses the system Python populated in the previous step.
        run: ./scripts/setup.sh --skip-venv

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit (all files)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Pytest
        # tests/test_workflow_smoke.py skips gracefully without DIFY_API_KEY.
        run: pytest tests/ -v --tb=short

      - name: Provenance check (warn-only, spec 022 D6)
        # Reports stale/orphan promoted templates; warn-only (no --strict) until the curated tier
        # is measured clean, per spec 022 Q6 warn->measure->gate discipline.
        run: python tools/dify_base/check_provenance.py

  # Spec 011: compile + type-check + unit-test the builder app (server + web). Pre-commit excludes
  # apps/ (own TS/Node toolchain), so this is the ONLY regression net for the gate/lock/CSRF logic.
  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/builder/package-lock.json
            apps/builder/web/package-lock.json

      # Spec 037 AC 2 — the runnability parity test spawns real python (the probe AND the /report
      # skill's report_structure.py both need pyyaml) and HARD-FAILS (never skips) when CI is set,
      # so the Python↔TS detector-drift guard can't silently rot. This job was Node-only before 037.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python deps for the runnability parity test (spec 037)
        run: pip install pyyaml

      - name: Install server deps
        working-directory: apps/builder
        run: npm ci

      - name: Install web deps
        working-directory: apps/builder/web
        run: npm ci

      - name: Server type-check (tsc --noEmit, server + tests)
        working-directory: apps/builder
        run: npm run typecheck

      - name: Server unit tests (node --test via tsx)
        working-directory: apps/builder
        run: npm test

      - name: Web build (tsc --noEmit + vite build)
        working-directory: apps/builder/web
        run: npm run build

      - name: Web unit tests (vitest)
        working-directory: apps/builder/web
        run: npm test
