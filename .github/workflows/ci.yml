name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install Python deps
        # Must come before setup.sh: with --skip-venv, the index rebuild step
        # uses system Python and needs pyyaml available.
        run: |
          uv pip install --system \
              pre-commit pytest pyyaml jsonschema python-dotenv \
              requests syrupy check-jsonschema yamllint pydantic \
              pydantic-settings pycryptodome httpx sqlalchemy \
              charset-normalizer pytz flask redis yarl flask-login cachetools

      - name: Bootstrap workspace
        # Clones vendor/dify-src/ at .dify-tag plus skills/corpus.
        # --skip-venv: CI uses the system Python populated in the previous step.
        run: ./scripts/setup.sh --skip-venv

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit (all files)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Pytest
        # tests/test_workflow_smoke.py skips gracefully without DIFY_API_KEY.
        run: pytest tests/ -v --tb=short

  # Spec 011: compile + type-check + unit-test the builder app (server + web). Pre-commit excludes
  # apps/ (own TS/Node toolchain), so this is the ONLY regression net for the gate/lock/CSRF logic.
  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/builder/package-lock.json
            apps/builder/web/package-lock.json

      - name: Install server deps
        working-directory: apps/builder
        run: npm ci

      - name: Install web deps
        working-directory: apps/builder/web
        run: npm ci

      - name: Server type-check (tsc --noEmit, server + tests)
        working-directory: apps/builder
        run: npm run typecheck

      - name: Server unit tests (node --test via tsx)
        working-directory: apps/builder
        run: npm test

      - name: Web build (tsc --noEmit + vite build)
        working-directory: apps/builder/web
        run: npm run build

      - name: Web unit tests (vitest)
        working-directory: apps/builder/web
        run: npm test
