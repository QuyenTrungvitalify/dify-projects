    - data:
        code: |
          import json

          # TODO: the field name YOUR receiver expects ("data" / "text" / "rows" / …).
          PAYLOAD_KEY = "tsv_data"


          def main(raw_output: str) -> dict:
              text = (raw_output or "").strip()

              # Undo the display fence added upstream. Defensive on purpose: an empty or None
              # upstream value must return an empty payload, never raise.
              if text.startswith("```"):
                  nl = text.find("\n")
                  text = text[nl + 1:] if nl != -1 else ""
              text = text.rstrip()
              if text.endswith("```"):
                  text = text[:-3]
              plain = text.strip("\n")

              # Build the ENTIRE JSON body here. Never concatenate it in the HTTP node: the
              # first tab, newline or quote in the payload would produce invalid JSON.
              return {"json_body": json.dumps({PAYLOAD_KEY: plain}, ensure_ascii=False)}
        code_language: python3
        outputs:
          json_body:
            children: null
            type: string
