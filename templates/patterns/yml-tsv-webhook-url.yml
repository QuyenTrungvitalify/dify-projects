    - data:
        code: |
          # The contract enforcer. The prompts ASK for clean TSV; this node GUARANTEES it.
          COLUMN_COUNT = 14           # TODO: 13 payload columns + 1 audit column
          WRAP_RECOVERY_COLUMNS = [6, 7]   # TODO: 0-based columns that may hold long free text


          def main(args=None, **kwargs):
              if args is None:
                  args = kwargs
              array_data = args.get("array_data", []) or []

              rows = {}
              for text_block in array_data:
                  if not text_block or not isinstance(text_block, str):
                      continue

                  last_id = None
                  for line in text_block.strip().split("\n"):
                      line = line.strip()
                      if not line:
                          continue

                      parts = line.split("\t")
                      # A line counts as data ONLY if its first cell is a number. This is what
                      # makes a stray ``` fence or a "Sure, here you go!" preamble harmless.
                      head = parts[0].replace("-", "").replace(".", "").strip()
                      if head.isdigit():
                          idx = int(head)
                          last_id = idx
                          if idx not in rows:
                              while len(parts) < COLUMN_COUNT:
                                  parts.append("")
                              rows[idx] = parts[:COLUMN_COUNT]
                      elif last_id is not None:
                          # The model wrapped a long cell onto the next line: glue it back.
                          for col in WRAP_RECOVERY_COLUMNS:
                              if len(rows.get(last_id, [])) > col:
                                  rows[last_id][col] = (rows[last_id][col] + " " + line).strip()

              final_rows = []
              for key in sorted(rows.keys()):
                  row = rows[key]

                  # The last column collects every complaint: whatever the LLM auditor wrote,
                  # plus the deterministic checks below. Keep both — only these are reliable.
                  existing = str(row[COLUMN_COUNT - 1]).strip()
                  errors = [existing] if existing else []

                  # TODO: your deterministic validations. Kept here as shape, not as rules.
                  payload = row[6] if len(row) > 6 else ""
                  if not payload.strip():
                      errors.append("empty payload column")
                  elif len(payload.split()) > 60:
                      errors.append("payload too long ({} words)".format(len(payload.split())))

                  row[COLUMN_COUNT - 1] = " / ".join(errors) if errors else ""
                  final_rows.append("\t".join([str(p).strip() for p in row[:COLUMN_COUNT]]))

              # The ```tsv fence is a UI affordance: it makes Dify keep the newlines and show a
              # copy button. The relay branch strips it again before sending.
              return {"final_output": "```tsv\n" + "\n".join(final_rows) + "\n```"}
        code_language: python3
        outputs:
          final_output:
            children: null
            type: string
