# Pattern: Chunked Batch → TSV → Fire-and-Forget Webhook Relay
#
# Use case: an operator submits a free-text list; the workflow generates one structured ROW per
# item (chunked so the LLM is called a handful of times, not once per item), routes each chunk to
# one of two prompt variants, runs a QC pass, assembles a fixed-width TSV table for the operator —
# and THEN relays that same table to a downstream receiver over HTTP as a pure side effect. The
# relay is fail-soft by construction: a dead endpoint, a 5xx or a timeout must never cost the
# operator the table they waited for. Classic shapes: bulk content generation handed off to a
# spreadsheet/webhook sink, exam/catalog/row generation with a downstream ingest, any
# "give me the result AND ship it onward" build.
#
# Flow:
#   Start (category select + item_list paragraph)
#     → Code: split list → classify into 2 groups → chunk into "<label>|<payload>" strings
#     → Iteration over chunks:
#         Code: peel the "<label>|" envelope → { type, clean_text }
#         → If-Else: type == type_a ?
#             true  → LLM A: generate rows (variant A prompt)
#             false → LLM B: generate rows (variant B prompt)
#         → Variable Aggregator: merge both variants into one stream
#         → LLM QC: audit each row, append a complaint column (never rewrites columns 1..N-1)
#     → Code: assemble + validate + pad to a fixed column count → fenced TSV
#     ├─→ End (final_output)                              ← the operator's result, untouchable
#     └─→ Code: strip the fence, json.dumps the payload
#           → HTTP POST (error_strategy: fail-branch)
#               ├─ success-branch ─┐
#               └─ fail-branch ────┴→ Template: one-line relay status
#                                       → End (send_result)
#
# Customization points (`# TODO:`):
#   1. Start variables — `category` options and what `item_list` actually holds.
#   2. The classification rule + CHUNK_SIZE in "Split & chunk input".
#   3. Both generator prompts (LLM A / LLM B) and the column contract they must emit.
#   4. The QC prompt — the one rule you want an LLM to judge.
#   5. COLUMN_COUNT + the deterministic validations in "Assemble & validate rows".
#   6. PAYLOAD_KEY in "Build relay payload" — the field name YOUR receiver expects.
#   7. The relay URL, and the auth header + `RELAY_WEBHOOK_TOKEN` env secret (delete both if your
#      receiver authenticates by token-in-URL only).
#   8. Model choice — provider/name are blank placeholders (configure in Dify, or let the builder
#      inject at test/deploy). `dependencies: []` for the same reason; add the plugin hash from
#      templates/tool-catalog.json once you pick a provider.
#
# GOTCHA: `{{start.level}}` IS NOT A REFERENCE. The source build shipped prompts mixing a real
#   `{{#<node_id>.<field>#}}` ref with a bare `{{start.<var>}}`, and Dify rendered the bare form as
#   LITERAL TEXT into the prompt — the model was silently told the category was the string
#   "{{start.level}}". No linter catches it (ref linting only inspects the `{{# … #}}` shape) and
#   nothing fails loudly. The ONLY valid form is `{{#<node_id>.<field>#}}`. Grep your prompts for
#   `{{` without a `#` before trusting any generated text.
# GOTCHA: `http://localhost/...` inside an http-request node means the DIFY SERVER CONTAINER, not
#   your laptop. A webhook URL copy-pasted from the browser address bar connects to nothing in a
#   Docker deployment. Use the in-network service name (`http://nginx/...`),
#   `http://host.docker.internal/...`, or the host's LAN IP.
# GOTCHA: an http-request `timeout:` left unset defaults to 0 — that is "unconfigured", not
#   "unlimited by choice", and a hung receiver stalls the run. Always set real values, and note the
#   exported DSL spells the keys `max_connect_timeout` / `max_read_timeout` / `max_write_timeout`
#   (NOT `connect`/`read`/`write`).
# GOTCHA: a fail-branch that dead-ends is worse than no fail-branch — the operator gets nothing on
#   failure, not even the work already finished. BOTH `success-branch` and `fail-branch` edges must
#   converge on a handler and reach a terminal node. The handle replaces `source` in the
#   `sourceHandle` field AND in the edge id (`<src>-fail-branch-<dst>-target`). At runtime only the
#   branch that fired carries values; the other reads empty — which is why the status template
#   switches on `error_message` being non-empty.
# GOTCHA: TWO `end` nodes on parallel branches is legal and is the right way to bolt a side effect
#   onto an existing workflow — the original end keeps its exact output contract, the new end
#   reports the relay. Both outputs render side by side in the run result.
# GOTCHA: never build the JSON body by concatenation in the HTTP node's field. A TSV payload is
#   full of tabs, newlines and quotes; the first one produces invalid JSON. Build the ENTIRE body
#   with `json.dumps` in a code node and pass the resulting string as a single `raw-text` body value.
# GOTCHA: the ```-fence is a UI affordance, not data. Wrapping the final text in ```tsv makes Dify
#   preserve newlines and show a copy button — so the relay branch has to strip it again before
#   sending. That is the entire reason "Build relay payload" exists. Strip defensively: an empty or
#   None upstream value must not raise.
# GOTCHA: an LLM will not emit clean TSV, ever. The assembly code node is the contract enforcer,
#   not the prompt: it accepts a line ONLY if its first cell is a number, pads short rows to the
#   fixed column count, re-glues cells the model wrapped onto the next line, and sorts by id. That
#   is what makes a stray fence or a "Sure, here you go!" preamble harmless.
# GOTCHA: the `"<label>|<payload>"` envelope is how a routing decision survives an `array[string]`
#   iterator. Dify iterations carry one scalar per item, so encoding the branch label into the
#   string lets ONE iteration fan out to two prompt variants — no second iterator, no object array.
# GOTCHA: this shape is NOT idempotent — every run re-POSTs the whole table. If duplicates hurt,
#   dedup in the receiver or record sent-state outside the workflow.
