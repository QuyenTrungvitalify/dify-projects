    - data:
        code: |
          # TODO: replace the classification rule and CHUNK_SIZE with yours.
          GROUP_A = "type_a"
          GROUP_B = "type_b"
          CHUNK_SIZE = 5


          def main(args=None, **kwargs):
              if args is None:
                  args = kwargs
              raw_text = args.get("item_list", "") or ""

              # Accept both newline- and comma-separated input; drop blanks.
              items = [w.strip() for w in raw_text.replace("\n", ",").split(",") if w.strip()]

              group_a = []
              group_b = []
              for i, item in enumerate(items):
                  item_clean = item.strip()
                  # The 1-based index is glued to the item so every later stage (LLM output,
                  # QC, assembly) can key a row back to the operator's input order.
                  indexed = "{}:{}".format(i + 1, item_clean)
                  # TODO: your routing rule. Shown: multi-word entries go to group B.
                  if " " in item_clean:
                      group_b.append(indexed)
                  else:
                      group_a.append(indexed)

              chunks = []
              for label, group in ((GROUP_B, group_b), (GROUP_A, group_a)):
                  for i in range(0, len(group), CHUNK_SIZE):
                      # "<label>|<payload>" — the label rides through the array[string]
                      # iterator so ONE iteration can fan out to two prompt variants.
                      chunks.append(label + "|" + ", ".join(group[i:i + CHUNK_SIZE]))

              return {"chunked_array": chunks}
