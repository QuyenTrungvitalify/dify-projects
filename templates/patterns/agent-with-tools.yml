# Pattern: Agent with Tools
#
# Use case: autonomous agent that uses tools (plugins) to answer queries.
# The Agent node decides which tool to call (search, calculator, custom API)
# based on the user query, executes it, and synthesizes the answer.
#
# Flow:
#   Start (user query)
#     → Agent (with tool list)
#     → End
#
# Customization points (`# TODO:`):
#   1. Tool list: register plugin tools available to the agent (web search,
#      time, custom HTTP, etc.). Each tool needs provider_name + tool_name
#      from your Dify workspace's installed plugins.
#   2. Agent strategy: react | function_calling | custom planning.
#   3. Model: should support tool/function calling well (GPT-4-class, Claude,
#      Gemini Pro with function calling enabled).
#   4. Max iterations: limit reasoning loops to prevent infinite runs.
#
# NOTE: this skeleton omits dependency hashes — fill in `dependencies:` with
# the plugin marketplace IDs from your workspace after import. The Agent node
# `agent_parameters.tools` references those plugins.

app:
  description: 'Pattern: ReAct-style agent with pluggable tools'
  icon: "\U0001F916"
  icon_background: '#E8E1FF'
  icon_type: emoji
  mode: workflow
  name: 'Pattern: Agent with Tools'
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: { enabled: false }
    opening_statement: ''
    retriever_resource: { enabled: true }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions: []
    suggested_questions_after_answer: { enabled: false }
    text_to_speech: { enabled: false, language: '', voice: '' }
  graph:
    edges:
    - id: 1700003000001-source-1700003000002-target
      source: '1700003000001'
      target: '1700003000002'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: start, targetType: agent }
      zIndex: 0
    - id: 1700003000002-source-1700003000003-target
      source: '1700003000002'
      target: '1700003000003'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: agent, targetType: end }
      zIndex: 0
    nodes:
    - id: '1700003000001'
      type: custom
      data:
        title: 'User Query'
        type: start
        variables:
        - variable: query
          label: query
          type: paragraph
          required: true
          max_length: 2000
          hint: 'What the user wants the agent to figure out'
          options: []
          placeholder: ''
      position: { x: 0, y: 280 }
      positionAbsolute: { x: 0, y: 280 }
      width: 242
      height: 107
      sourcePosition: right
      targetPosition: left

    - id: '1700003000002'
      type: custom
      data:
        title: 'Agent'
        type: agent
        # TODO: pick a model with strong tool-use capability
        agent_parameters:
          model:
            provider: ''
            name: ''
            mode: chat
            completion_params:
              temperature: 0.2
          tools: []
          # TODO: register tools available to the agent. Example shape:
          # tools:
          #   - provider_id: langgenius/google_search
          #     provider_type: builtin
          #     tool_name: google_search
          #     tool_label: Google Search
          #     tool_configurations: {}
          #     enabled: true
          instruction: |
            You are a helpful agent. Use the available tools to answer the user's query.
            Think step by step: identify what information is needed, call the most
            appropriate tool, then synthesize a clear answer.
            # TODO: customize instructions, persona, constraints
          query_variable_selector: ['1700003000001', query]
          max_iteration: 5
          memory: null
          agent_strategy_provider_name: langgenius/agent
          agent_strategy_name: react
          agent_strategy_label: 'ReAct'
        output_type: text
      position: { x: 342, y: 280 }
      positionAbsolute: { x: 342, y: 280 }
      width: 241
      height: 130
      sourcePosition: right
      targetPosition: left

    - id: '1700003000003'
      type: custom
      data:
        title: 'Output'
        type: end
        outputs:
        - variable: answer
          value_selector: ['1700003000002', text]
          value_type: string
      position: { x: 684, y: 280 }
      positionAbsolute: { x: 684, y: 280 }
      width: 241
      height: 100
      sourcePosition: right
      targetPosition: left

    viewport: { x: 0, y: 0, zoom: 0.7 }
