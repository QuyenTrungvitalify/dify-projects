    - id: '1783928312581'
      type: custom
      data:
        title: Parse mapping
        type: code
        code_language: python3
        # GOTCHA: the extractor renders xlsx as a markdown table; is_array_file → array[string]
        code: |
          import json


          def _is_separator(cells):
              return all(c == "" or set(c) <= {"-", ":"} for c in cells)


          def _clean(value):
              value = (value or "").strip()
              return "" if value.lower() == "nan" else value


          def main(text_list: list) -> dict:
              text = text_list[0] if isinstance(text_list, list) and text_list else ""
              rows = []
              for line in (text or "").splitlines():
                  stripped = line.strip()
                  if not stripped.startswith("|"):
                      continue
                  cells = [c.strip() for c in stripped.strip("|").split("|")]
                  if all(c == "" for c in cells) or _is_separator(cells):
                      continue
                  rows.append(cells)
              if rows:
                  rows = rows[1:]  # skip the header row
              mapping = {}
              for cells in rows:
                  key = _clean(cells[0]) if len(cells) > 0 else ""
                  dest = _clean(cells[1]) if len(cells) > 1 else ""
                  if key and dest:
                      mapping[key] = dest
              return {"map_json": json.dumps(mapping, ensure_ascii=False)}
        outputs:
          map_json: { type: string, children: null }
        variables:
        - value_selector: ['1783928312579', text]
          value_type: 'array[string]'
          variable: text_list
      position: { x: 600, y: 260 }
      positionAbsolute: { x: 600, y: 260 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left

    - id: '1783928312583'
      type: custom
      data:
        title: Parse rows
        type: code
        code_language: python3
        # TODO: set NAME_COL / TARGET_COL to your sheet's 0-based column positions
        # GOTCHA: every cells[N] access is length-guarded and main() always RETURNS — the ④ live
        #   test uploads a generic 2-column sample.xlsx, so an unguarded index would crash it
        code: |
          import json

          NAME_COL = 0
          TARGET_COL = 1


          def _is_separator(cells):
              return all(c == "" or set(c) <= {"-", ":"} for c in cells)


          def _clean(value):
              value = (value or "").strip()
              return "" if value.lower() == "nan" else value


          def main(text_list: list) -> dict:
              text = text_list[0] if isinstance(text_list, list) and text_list else ""
              table = []
              for line in (text or "").splitlines():
                  stripped = line.strip()
                  if not stripped.startswith("|"):
                      continue
                  cells = [c.strip() for c in stripped.strip("|").split("|")]
                  if all(c == "" for c in cells) or _is_separator(cells):
                      continue
                  table.append(cells)
              if table:
                  table = table[1:]  # skip the header row
              items = []
              for cells in table:
                  name = _clean(cells[NAME_COL]) if len(cells) > NAME_COL else ""
                  target = _clean(cells[TARGET_COL]) if len(cells) > TARGET_COL else ""
                  if not name:
                      continue
                  items.append(json.dumps({"name": name, "target": target}, ensure_ascii=False))
              return {"items": items, "count": len(items)}
        outputs:
          items: { type: 'array[string]', children: null }
          count: { type: number, children: null }
        variables:
        - value_selector: ['1783928312577', text]
          value_type: 'array[string]'
          variable: text_list
      position: { x: 600, y: 60 }
      positionAbsolute: { x: 600, y: 60 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left

