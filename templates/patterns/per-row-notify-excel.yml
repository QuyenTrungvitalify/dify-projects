        is_parallel: true
        parallel_nums: 2
        iterator_input_type: 'array[string]'
        iterator_selector: ['1783928312583', items]
        output_selector: ['1783928312597', output]
        output_type: 'array[string]'
        start_node_id: 1783928312586start
