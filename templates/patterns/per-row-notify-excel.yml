        isInIteration: true
        iteration_id: '1783928312586'
        logical_operator: and
        conditions:
        - variable_selector: ['1783928312588', should_notify]
          comparison_operator: is
          value: 'true'
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - variable_selector: ['1783928312588', should_notify]
            comparison_operator: is
            value: 'true'
      parentId: '1783928312586'
