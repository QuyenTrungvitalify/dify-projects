    - id: '1783928312588'
      type: custom
      data:
        title: Judge row
        type: code
        code_language: python3
        isInIteration: true
        iteration_id: '1783928312586'
        # TODO: replace the judge logic — decide should_notify + destination for YOUR rule
        #   (default: notify when the target cell is EMPTY and the name maps to a destination;
        #    need a date rule? see the run-date GOTCHA in the pattern header)
        code: |
          import json


          def main(item_json: str, map_json: str) -> dict:
              try:
                  row = json.loads(item_json) if item_json else {}
              except Exception:
                  row = {}
              if not isinstance(row, dict):
                  row = {}
              try:
                  dest_map = json.loads(map_json) if map_json else {}
              except Exception:
                  dest_map = {}
              if not isinstance(dest_map, dict):
                  dest_map = {}
              name = str(row.get("name", "") or "")
              target = row.get("target", "")
              is_empty = target is None or str(target).strip() == ""
              destination = str(dest_map.get(name, "") or "")
              should = bool(is_empty and name and destination)
              return {"should_notify": should, "name": name, "destination": destination}
        outputs:
          should_notify: { type: boolean, children: null }
          name: { type: string, children: null }
          destination: { type: string, children: null }
        variables:
        - value_selector: ['1783928312586', item]
          value_type: string
          variable: item_json
        - value_selector: ['1783928312581', map_json]
          value_type: string
          variable: map_json
      parentId: '1783928312586'
      extent: parent
      position: { x: 100, y: 90 }
      positionAbsolute: { x: 1000, y: 150 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left
      zIndex: 1002

