# Pattern: Per-Row Conditional Notify — Excel upload front-end (file → extract → parse → iterate)
#
# Use case: the operator uploads the raw Excel files they already have (a rows list + a
# key→destination mapping); the workflow extracts and parses them IN-FLOW, then decides PER ROW
# whether to act and POSTs a message to the destination looked up per row. This is the
# start-node-as-trigger shape (spec 056, スタートノードをトリガー): Start asks ONLY for raw
# artifacts the operator physically has — no pre-digested JSON, no hand-typed column names or
# dates. Distilled from a field-proven ChatWork reminder rework (production build, 2026-07).
#
# Flow:
#   Start (rows Excel + mapping Excel — two file-list inputs, nothing else)
#     → Document Extractor ×2 (xlsx → markdown table, array[string])
#     → Code: parse mapping (key → destination map, JSON string)
#     → Code: parse rows (guarded column access → array[string] + count)
#     → Iteration (parallel, continue-on-error) over rows:
#         Code: judge row (should_notify? + destination)
#         → If-Else: notify?
#             true  → LLM: compose message → HTTP: POST to destination
#             false → (skip)
#         → Variable Aggregator: collect row results
#     → End (aggregated results + row_count — truncation is always visible)
#
# Customization points (`# TODO:`):
#   1. Column constants in "Parse rows" (NAME_COL / TARGET_COL) + the Start hints — match YOUR
#      sheet layout. Header row is skipped by both parsers.
#   2. Judge logic in "Judge row" — your emptiness/eligibility rule.
#   3. HTTP node: endpoint URL + auth header for YOUR service (Slack/Teams/ChatWork/custom).
#   4. LLM prompts — tone + language of the message.
#   5. Model choice (provider/name are blank placeholders — configure in Dify or let the
#      builder inject at test/deploy).
#
# GOTCHA: run-date rule (spec 056, supersedes the absolutist spec 050 D2b form): date-boundary
#   judgments must not depend on the sandbox's implicit timezone. Machine caller (cron → API):
#   require a `today` Start input. Human operator (this pattern's default): if your judge needs a
#   date, add an OPTIONAL `today` input with an in-code fallback explicitly pinned to the
#   business timezone — e.g. datetime.now(timezone(timedelta(hours=9))) for JST — never naive
#   now(). This pattern's default judge is date-free.
# GOTCHA: document-extractor renders xlsx as a MARKDOWN TABLE (and outputs array[string] when
#   is_array_file is true — unwrap the first element). Cells containing a literal `|` will split
#   wrong; keep such data out of the judged columns or pre-clean the sheet.
# GOTCHA: parse code guards every fixed-column access (len(cells) > COL) and always RETURNS —
#   never raises. The ④ live test uploads a generic 2-column sample.xlsx for every file input, so
#   an unguarded cells[N] would fail every pattern-derived live test.
# GOTCHA: iteration hard limit is ≤30 items (constraints.md §2). Need more? Batch BEFORE the
#   iteration — and if you cap the number of batches, End MUST carry a truncated signal; never
#   slice the batch list silently (row_count exists so a cap is visible).
# GOTCHA: services with a CUSTOM auth header (ChatWork-style token headers, many webhook tokens)
#   use `authorization: { type: no-auth }` + the token in `headers:` via an environment variable
#   (`name:` form, value_type secret) — do NOT force api-key auth types that rewrite headers.
# GOTCHA: this shape is NOT idempotent — re-running re-notifies every matching row. If re-runs
#   must be safe, dedup upstream or record sent-state outside the workflow.
#
# x-provenance: source=original repo=
#   commit= file="リスト入力催促ChatWork通知フロー.yml (field export, not committed)" orig_sha256= promoted=2026-07-13
#   license=MIT spec=056 known_good_dify=1.13.0
