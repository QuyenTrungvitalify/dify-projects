    - id: '1785218032501'
      type: custom
      data:
        title: dedupe vs existing + build rows
        type: code
        code_language: python3
        code: |
          import json
          import re


          def _norm(u):
              u = (u or "").strip().lower()
              u = re.sub(r"#.*$", "", u)
              u = re.sub(r"\?.*$", "", u)
              u = re.sub(r"/+$", "", u)
              u = re.sub(r"^https?://", "", u)
              u = re.sub(r"^www\.", "", u)
              return u


          def main(articles_json: str, existing: str, run_at: str) -> dict:
              try:
                  arts = json.loads(articles_json) if articles_json else []
              except Exception:
                  arts = []
              if not isinstance(arts, list):
                  arts = []
              existing = existing or ""
              existing_norm = set(_norm(u) for u in re.findall(r"https?://[^\s\"',\]]+", existing))
              rows = []
              skipped = 0
              for a in arts:
                  if not isinstance(a, dict):
                      continue
                  key = _norm(a.get("url"))
                  if not key or key in existing_norm:
                      skipped += 1   # already recorded → never re-append (idempotent on same-day re-run)
                      continue
                  existing_norm.add(key)
                  rows.append([
                      run_at or "",
                      a.get("title", ""),
                      a.get("url", ""),
                      a.get("media", ""),
                      a.get("summary", ""),
                      a.get("body", ""),
                  ])
              return {
                  "rows_json": json.dumps(rows, ensure_ascii=False),
                  "write_count": len(rows),
                  "skipped": skipped,
              }
        variables:
        - variable: articles_json
          value_type: string
          value_selector: ['1785218032496', articles_json]
        - variable: existing
          value_type: string
          value_selector: ['1785218032498', text]
