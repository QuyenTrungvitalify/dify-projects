    # 11. 2系統を統合し重複排除（source-A を優先＝先勝ち）
    - id: '1785218032483'
      type: custom
      data:
        title: merge + dedupe
        type: code
        code_language: python3
        code: |
          import json
          import re


          def _norm(u):
              u = (u or "").strip().lower()
              u = re.sub(r"#.*$", "", u)
              u = re.sub(r"\?.*$", "", u)
              u = re.sub(r"/+$", "", u)
              u = re.sub(r"^https?://", "", u)
              u = re.sub(r"^www\.", "", u)
              return u


          def _load(s):
              try:
                  v = json.loads(s) if s else []
              except Exception:
                  v = []
              return v if isinstance(v, list) else []


          def main(cw_json: str, web_json: str) -> dict:
              cw = _load(cw_json)
              web = _load(web_json)
              by_key = {}
              order = []
              for rec in cw + web:   # source-A first = priority source survives a URL collision (first-wins)
                  if not isinstance(rec, dict):
                      continue
                  key = _norm(rec.get("url")) or ("t:" + str(rec.get("title", "")).strip().lower())
                  if not key or key in by_key:
                      continue
                  by_key[key] = rec
                  order.append(key)
              merged = [by_key[k] for k in order]
              return {"records_json": json.dumps(merged, ensure_ascii=False), "count": len(merged)}
        variables:
        - variable: cw_json
          value_type: string
          value_selector: ['1785218032476', records_json]
        - variable: web_json
          value_type: string
          value_selector: ['1785218032480', records_json]
        outputs:
          records_json: { type: string, children: null }
          count: { type: number, children: null }
      position: { x: 2900, y: 200 }
