# Pattern: Scheduled multi-source digest → rank → per-item LLM writeup → idempotent append → notify-on-empty
#
# Use case: an unattended recurring job that INGESTS from more than one source (e.g. attachment
#   images read by a Vision LLM + a web-search tool), MERGES them with a priority rule, RANKS to a
#   top-N shortlist, fetches each item's full source and has an LLM WRITE it up, then APPENDS one row
#   per item to a spreadsheet tool WITHOUT duplicating on re-run, and PINGS a channel when nothing was
#   written. The shape a stakeholder asks for as 「毎朝…集めて記事化してスプレッドシートに追記、0件なら通知」.
#
# WHY THIS PATTERN EXISTS: existing scheduled patterns model ONE source and a single append
#   (scheduled-tool-append) or one-row-per-item notify (per-row-notify). This is the first that
#   combines: multi-source ingest, a Vision-in-iteration read, cross-source dedupe with a priority
#   winner, an LLM ranker, a second per-item iteration that fetches + writes, read-existing→dedupe→
#   append idempotency, and a conditional notify. Reach for it when a build needs MORE than one of
#   those steps; for a plain "fetch → write one thing" use scheduled-tool-append instead.
#
# Flow:
#   Trigger: Schedule (visual, daily, explicit timezone Asia/Tokyo)
#     → Code: config + JST time window (edit the REPLACE_ME values)
#     → HTTP: GET list attachments from the source API (custom auth header)
#     → Code: filter to images in the last 24h (defensive, never raises; caps at 30 = iteration max)
#     → Iteration A (continue-on-error): per image → HTTP GET a download URL → Vision LLM extract JSON
#     → Code: shape source-A records
#     → Tool: web search (swap for any catalogued tool) → Code: shape source-B records
#     → Code: merge + dedupe by normalized URL, source-A wins on collision (priority)
#     → LLM: pick the top-N urls → Code: restore the full records for the picked urls (fill to N)
#     → Iteration B (continue-on-error): per pick → Code parse → HTTP GET full text → LLM write article
#     → Code: drop the skipped (empty) ones
#     → Tool: read existing sheet rows → Code: dedupe vs existing + build append rows + JST stamp
#     → Tool: append rows (one item = one row) → Code: run summary + should_notify (write_count == 0)
#     → If-else: should_notify?  true → HTTP POST a notification  /  false → End
#     → End (summary / write_count / skipped)
#
# Customization points (# TODO:):
#   1. Schedule time in the trigger (12-hour visual format); keep the timezone explicit.
#   2. The REPLACE_ME config values in "config" (source container id, search keywords, sheet range,
#      URL column index).
#   3. Source API URL + the custom auth header name in the two HTTP nodes; the env var it reads.
#   4. Every LLM prompt (extract / rank / write) + its output schema, and the model on each llm node
#      (provider/name are blank placeholders — wire a model, Vision-capable for the image reader).
#   5. THE TOOLS: swap provider_id/provider_name/tool_name/tool_parameters for the tool you need AND
#      swap the matching `dependencies:` entry (both from templates/tool-catalog.json, or resolve via
#      .venv/bin/python tools/dify_base/marketplace.py resolve <org>/<name>).
#   6. The notification endpoint + body in the final HTTP POST; the summary/message text in "summary".
#
# GOTCHA: passing a source's temporary DOWNLOAD URL straight into a Vision LLM is NOT verified on real
#   Dify — the http-request `files` output → Vision `variable_selector` is the default here, but if a
#   URL can't be handed to the model directly you must add a child node that re-fetches the URL as a
#   BINARY file variable. Confirm this on the first live test.
# GOTCHA: merge order IS the priority rule — feed the trusted/priority source FIRST into the dedupe so
#   the first-wins loop keeps it on a URL collision (here source-A before web). Reversing it silently
#   flips which duplicate survives.
# GOTCHA: idempotency lives in the read-existing → dedupe → append trio, NOT in the tool. Same-day
#   re-runs must READ the destination first and drop URLs already present, or every run re-appends.
# GOTCHA: notify-on-empty is deliberate — a 0-write run POSTs a message so an empty sheet the next
#   morning has a visible cause (unreadable inputs / inaccessible sources / all-duplicate). Without it
#   the failure is silent.
# GOTCHA: both iterations use error_handle_mode: continue-on-error so ONE unreadable image / one
#   inaccessible article is skipped and the run finishes; the shape-code after each iteration drops the
#   empty ({}) results those skips produce.
# GOTCHA: compute JST from UTC INSIDE the code (utcnow + 9h), never trust the sandbox timezone.
# GOTCHA: Dify schedule triggers default to UTC — an "8:00 AM" JST job fires at 17:00 JST unless
#   `timezone: Asia/Tokyo` is set. And publishing is not enough: the trigger must also be ENABLED in
#   Dify Studio before it fires.
# GOTCHA: env vars are declared with `name:` (NOT `variable:`) or the import fails; `dependencies:`
#   must stay NON-EMPTY for tool nodes or Dify never prompts to install and the tool fails at runtime.
app:
  description: 'Scheduled multi-source digest → dedupe, rank, write per item, idempotent append to a spreadsheet tool, notify-on-empty; multi-source ingest (attachment images via Vision + web search) merged with a priority winner, top-N selection, per-row article writeup in a continue-on-error iteration, read-existing→dedupe→append for idempotency (trigger-entry, no operator; spec 052)'
  icon: "\U0001F4F0"
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  name: scheduled_multisource_digest_to_sheet
  use_icon_as_answer_icon: false
