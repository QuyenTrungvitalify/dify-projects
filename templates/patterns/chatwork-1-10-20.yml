    - id: '1785218032462'
      type: custom
      data:
        title: config + time window
        type: code
        code_language: python3
        # TODO: edit room_id / keywords / sheet_range / url_col_index to your real values.
        code: |
          import datetime


          def main() -> dict:
              # ── customization point ─────────────────────────
              room_id = "REPLACE_ME"            # id of the source container (chat room / folder / feed)
              keywords = ""                      # web-search keywords (empty = skip the web source)
              sheet_range = "Sheet1!A:F"         # destination range (date/title/url/media/summary/body)
              url_col_index = 2                  # 0-based index of the existing-URL column (C = 2)
              # ────────────────────────────────────────────────
              # サンドボックスのTZに依存せず UTC 起点で JST を算出
              now_utc = datetime.datetime.utcnow()
              now_jst = now_utc + datetime.timedelta(hours=9)
              epoch = datetime.datetime(1970, 1, 1)
              now_ts = int((now_utc - epoch).total_seconds())
              since_ts = now_ts - 24 * 60 * 60
              return {
                  "room_id": room_id,
                  "keywords": keywords,
                  "sheet_range": sheet_range,
                  "url_col_index": url_col_index,
                  "since_ts": since_ts,
                  "run_at_jst": now_jst.strftime("%Y-%m-%d %H:%M:%S"),
              }
        variables: []
        outputs:
          room_id: { type: string, children: null }
          keywords: { type: string, children: null }
          sheet_range: { type: string, children: null }
          url_col_index: { type: number, children: null }
          since_ts: { type: number, children: null }
