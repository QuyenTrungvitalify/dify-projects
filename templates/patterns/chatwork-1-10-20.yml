    # 13. 選定URLに対応する完全レコードを復元（最大N件, 不足分は先頭から補完）
    - id: '1785218032487'
      type: custom
      data:
        title: restore picked records
        type: code
        code_language: python3
        code: |
          import json
          import re


          def _norm(u):
              u = (u or "").strip().lower()
              u = re.sub(r"#.*$", "", u)
              u = re.sub(r"\?.*$", "", u)
              u = re.sub(r"/+$", "", u)
              u = re.sub(r"^https?://", "", u)
              u = re.sub(r"^www\.", "", u)
              return u


          def main(selected: str, records_json: str) -> dict:
              try:
                  sel = json.loads(selected) if selected else []
              except Exception:
                  sel = re.findall(r"https?://[^\s\"']+", selected or "")
              if not isinstance(sel, list):
                  sel = []
              try:
                  recs = json.loads(records_json) if records_json else []
              except Exception:
                  recs = []
              if not isinstance(recs, list):
                  recs = []
              index = {}
              for r in recs:
                  if isinstance(r, dict):
                      index[_norm(r.get("url"))] = r
              picked, seen = [], set()
              for s in sel:
                  if isinstance(s, dict):
                      s = s.get("url", "")
                  k = _norm(s if isinstance(s, str) else "")
                  if k and k in index and k not in seen:
                      picked.append(index[k])
                      seen.add(k)
              # fill: if fewer than N, top up from the merged list (priority order)
              for r in recs:
                  if len(picked) >= 2:
                      break
                  if not isinstance(r, dict):
                      continue
                  k = _norm(r.get("url"))
                  if k and k not in seen:
                      picked.append(r)
                      seen.add(k)
              picked = picked[:2]
              items = [json.dumps(r, ensure_ascii=False) for r in picked]
              return {"selected_items": items, "count": len(items)}
        variables:
        - variable: selected
          value_type: string
          value_selector: ['1785218032485', text]
        - variable: records_json
          value_type: string
          value_selector: ['1785218032483', records_json]
        outputs:
          selected_items: { type: 'array[string]', children: null }
          count: { type: number, children: null }
      position: { x: 3500, y: 200 }
      positionAbsolute: { x: 3500, y: 200 }
      width: 242
      height: 140
      sourcePosition: right
      targetPosition: left
