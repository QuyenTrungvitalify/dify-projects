    # 4. 画像のみ・直近24hに絞り込み
    - id: '1785218032467'
      type: custom
      data:
        title: filter images (24h + ext)
        type: code
        code_language: python3
        code: |
          import json


          def main(files_json: str, since_ts) -> dict:
              try:
                  files = json.loads(files_json) if files_json else []
              except Exception:
                  files = []
              if not isinstance(files, list):
                  files = []
              try:
                  threshold = int(since_ts)
              except Exception:
                  threshold = 0
              exts = (".png", ".jpg", ".jpeg", ".gif", ".webp")
              ids = []
              for f in files:
                  if not isinstance(f, dict):
                      continue
                  name = str(f.get("filename", "") or "").lower()
                  up = f.get("upload_time", 0) or 0
                  try:
                      up = int(up)
                  except Exception:
                      up = 0
                  if up < threshold:
                      continue
                  if not name.endswith(exts):   # non-image (Excel/PDF/...) excluded
                      continue
                  fid = f.get("file_id")
                  if fid is None:
                      continue
                  ids.append(str(fid))
              ids = ids[:30]   # iteration は最大30件
              return {"file_ids": ids, "image_count": len(ids)}
        variables:
        - variable: files_json
          value_type: string
          value_selector: ['1785218032465', body]
        - variable: since_ts
          value_type: number
          value_selector: ['1785218032462', since_ts]
        outputs:
          file_ids: { type: 'array[string]', children: null }
          image_count: { type: number, children: null }
      position: { x: 900, y: 200 }
      positionAbsolute: { x: 900, y: 200 }
      width: 242
