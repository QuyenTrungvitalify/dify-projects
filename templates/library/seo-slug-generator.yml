# SEO Slug Generator — promoted curated template (spec 022 D5).
# Converts a title / content into a concise, SEO-friendly English URL slug (<=60 chars).
# x-provenance: source=awesome-dify-workflow-en repo=https://github.com/Formyselfonly/Awesome-Dify-Workflow-EN.git
#   commit=88842fc file="Workflow-Store/SEO Slug Generator.yml" orig_sha256=8e1b5d2c6d744ac57ac1dd2ec42480cff34c5365e2d7ee93c04193f7cae5ff3b promoted=2026-06-22 license=MIT
#
# Migrated 0.1.0 -> 0.6.0, model blanked to house style (set provider/name for your workspace).
app:
  description: 'Convert a title or content into a concise, SEO-friendly English URL slug (<=60 chars).'
  icon: "\U0001F517"
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 'SEO Slug Generator'
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: { enabled: false }
    opening_statement: ''
    retriever_resource: { enabled: true }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions: []
    suggested_questions_after_answer: { enabled: false }
    text_to_speech: { enabled: false, language: '', voice: '' }
  graph:
    edges:
    - id: 1782130098801-source-1782130098803-target
      source: '1782130098801'
      target: '1782130098803'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: start, targetType: llm }
      zIndex: 0
    - id: 1782130098803-source-1782130098806-target
      source: '1782130098803'
      target: '1782130098806'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: llm, targetType: end }
      zIndex: 0
    nodes:
    - id: '1782130098801'
      type: custom
      data:
        title: 'Input'
        type: start
        variables:
        - variable: title
          label: title
          type: paragraph
          required: true
          max_length: 200
          hint: 'Title or content to turn into a slug'
          options: []
          placeholder: ''
      position: { x: 0, y: 280 }
      positionAbsolute: { x: 0, y: 280 }
      width: 242
      height: 107
      sourcePosition: right
      targetPosition: left

    - id: '1782130098803'
      type: custom
      data:
        title: 'LLM — Slugify'
        type: llm
        # TODO: configure model — set provider/name to a model your workspace has installed
        #       (and add its plugin dependency hash to `dependencies:` above).
        model:
          provider: ''
          name: ''
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - role: system
          text: |
            Convert the input title or content into an SEO-friendly English URL slug.
            Rules:
            - Clearly convey the original meaning; be concise; never exceed 60 characters.
            - If the input is too long, first condense it to an English phrase within 60
              characters, then slugify.
            - If the title is too short to be meaningful, ask the user for a longer title.
            - Remove special characters; lowercase; words separated by single hyphens.
            Output only the slug — no commentary.
        - role: user
          text: '{{#1782130098801.title#}}'
        memory: null
        context: { enabled: false, variable_selector: [] }
        vision: { enabled: false }
      position: { x: 342, y: 280 }
      positionAbsolute: { x: 342, y: 280 }
      width: 241
      height: 98
      sourcePosition: right
      targetPosition: left

    - id: '1782130098806'
      type: custom
      data:
        title: 'Output'
        type: end
        outputs:
        - variable: slug
          value_selector: ['1782130098803', text]
          value_type: string
      position: { x: 684, y: 280 }
      positionAbsolute: { x: 684, y: 280 }
      width: 241
      height: 107
      sourcePosition: right
      targetPosition: left

    viewport: { x: 0, y: 0, zoom: 0.8 }
