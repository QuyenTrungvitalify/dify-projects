# Workspace mapping for {{project_name}}.
# Maps environment names to Dify workspace endpoints. Secrets live in envs/<env>.env
# (gitignored) and are referenced here by variable name.

project:
  name: "{{project_name}}"
  slug: "{{project_slug}}"
  group: "{{group}}"
  app_type: "{{app_type}}"
  dsl_version: "{{dsl_version}}"
  dify_tag: "{{dify_tag}}"

environments:
  dev:
    # Public API — used by tests/conftest.py (DifyWorkflowClient)
    base_url_var: DIFY_BASE_URL                  # https://.../v1
    api_key_var: DIFY_API_KEY                    # app-xxxx (per-app)
    workflow_app_id_var: DIFY_APP_ID
    # Console API — used by tools/dify_base/sync.py (GitOps)
    console_url_var: DIFY_CONSOLE_URL            # https://.../console/api
    console_token_var: DIFY_CONSOLE_TOKEN        # bearer from logged-in browser

  # Add staging / prod once dev is stable.
  # staging:
  #   base_url_var: DIFY_BASE_URL_STAGING
  #   api_key_var: DIFY_API_KEY_STAGING
  #   ...
