# Spec 050 AC1 fixture — a minimal "proven build" in the per-row-notify shape (the 2026-07-08
# ChatWork incident build, shrunk). Deliberately carries ALL FIVE promoted node types
# (iteration + http-request + if-else + code + llm) so the auto-derived Key Features exercise AC5,
# a WIRED model (provider+name present — a proven build actually ran its LLM), and the two D2b
# gotchas by design: `today` injected from outside (sandbox-timezone skew) and a custom auth header
# with `authorization: no-auth`. Domain specifics (api.chatwork.com, X-ChatWorkToken) stay IN —
# the distillation strips them; tests pin that the promoted pattern carries neither literal.
app:
  description: 'Per-row ChatWork reminder: iterate list rows, judge each, POST to mapped room, aggregate'
  icon: "\U0001F4E2"
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: per_row_notify_proven
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - name: CHATWORK_API_TOKEN
    value_type: secret
    value: ''
  features:
    file_upload: { enabled: false }
    opening_statement: ''
    retriever_resource: { enabled: false }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions: []
    suggested_questions_after_answer: { enabled: false }
    text_to_speech: { enabled: false, language: '', voice: '' }
  graph:
    edges:
    - id: 1783500000001-source-1783500000002-target
      source: '1783500000001'
      target: '1783500000002'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: start, targetType: code }
      zIndex: 0
    - id: 1783500000002-source-1783500000003-target
      source: '1783500000002'
      target: '1783500000003'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: code, targetType: iteration }
      zIndex: 0
    - id: 1783500000003-source-1783500000009-target
      source: '1783500000003'
      target: '1783500000009'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: false, isInLoop: false, sourceType: iteration, targetType: end }
      zIndex: 0
    - id: 1783500000003start-source-1783500000004-target
      source: 1783500000003start
      target: '1783500000004'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: true, isInLoop: false, iteration_id: '1783500000003', sourceType: iteration-start, targetType: code }
      zIndex: 1002
    - id: 1783500000004-source-1783500000005-target
      source: '1783500000004'
      target: '1783500000005'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: true, isInLoop: false, iteration_id: '1783500000003', sourceType: code, targetType: if-else }
      zIndex: 1002
    - id: 1783500000005-true-1783500000006-target
      source: '1783500000005'
      target: '1783500000006'
      sourceHandle: 'true'
      targetHandle: target
      type: custom
      data: { isInIteration: true, isInLoop: false, iteration_id: '1783500000003', sourceType: if-else, targetType: llm }
      zIndex: 1002
    - id: 1783500000005-false-1783500000008-target
      source: '1783500000005'
      target: '1783500000008'
      sourceHandle: 'false'
      targetHandle: target
      type: custom
      data: { isInIteration: true, isInLoop: false, iteration_id: '1783500000003', sourceType: if-else, targetType: variable-aggregator }
      zIndex: 1002
    - id: 1783500000006-source-1783500000007-target
      source: '1783500000006'
      target: '1783500000007'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: true, isInLoop: false, iteration_id: '1783500000003', sourceType: llm, targetType: http-request }
      zIndex: 1002
    - id: 1783500000007-source-1783500000008-target
      source: '1783500000007'
      target: '1783500000008'
      sourceHandle: source
      targetHandle: target
      type: custom
      data: { isInIteration: true, isInLoop: false, iteration_id: '1783500000003', sourceType: http-request, targetType: variable-aggregator }
      zIndex: 1002
    nodes:
    - id: '1783500000001'
      type: custom
      data:
        title: Start
        type: start
        variables:
        - variable: list_json
          label: Rows (JSON array string)
          type: paragraph
          required: true
          max_length: 100000
          hint: 'one object per row'
          options: []
          placeholder: ''
        - variable: room_map_json
          label: name -> room_id map (JSON)
          type: paragraph
          required: true
          max_length: 100000
          hint: '{"name": "room_id"}'
          options: []
          placeholder: ''
        - variable: today
          label: Run date (YYYY/MM/DD)
          type: text-input
          required: true
          max_length: 20
          hint: 'injected from outside to avoid sandbox timezone skew'
          options: []
          placeholder: ''
      position: { x: 0, y: 100 }
      positionAbsolute: { x: 0, y: 100 }
      width: 242
      height: 120
      sourcePosition: right
      targetPosition: left

    - id: '1783500000002'
      type: custom
      data:
        title: Parse rows
        type: code
        code_language: python3
        code: |
          import json


          def main(raw: str) -> dict:
              try:
                  rows = json.loads(raw) if raw else []
              except Exception:
                  rows = []
              if not isinstance(rows, list):
                  rows = []
              return {"items": [json.dumps(r, ensure_ascii=False) for r in rows]}
        outputs:
          items: { type: 'array[string]', children: null }
        variables:
        - value_selector: ['1783500000001', list_json]
          value_type: string
          variable: raw
      position: { x: 300, y: 100 }
      positionAbsolute: { x: 300, y: 100 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left

    - id: '1783500000003'
      type: custom
      data:
        title: Per row (Iteration)
        type: iteration
        error_handle_mode: continue-on-error
        is_parallel: false
        iterator_input_type: 'array[string]'
        iterator_selector: ['1783500000002', items]
        output_selector: ['1783500000008', output]
        output_type: 'array[string]'
        start_node_id: 1783500000003start
        width: 1400
        height: 360
      position: { x: 600, y: 60 }
      positionAbsolute: { x: 600, y: 60 }
      width: 1400
      height: 360
      sourcePosition: right
      targetPosition: left
      zIndex: 1

    - id: 1783500000003start
      type: custom-iteration-start
      data:
        title: ''
        type: iteration-start
        desc: ''
        isInIteration: true
      parentId: '1783500000003'
      position: { x: 24, y: 90 }
      positionAbsolute: { x: 624, y: 150 }
      width: 44
      height: 48
      sourcePosition: right
      targetPosition: left
      draggable: false
      selectable: false
      zIndex: 1002

    - id: '1783500000004'
      type: custom
      data:
        title: Judge row
        type: code
        code_language: python3
        isInIteration: true
        iteration_id: '1783500000003'
        code: |
          import json


          def main(item_json: str, room_map_json: str, today: str) -> dict:
              try:
                  row = json.loads(item_json) if item_json else {}
              except Exception:
                  row = {}
              try:
                  room_map = json.loads(room_map_json) if room_map_json else {}
              except Exception:
                  room_map = {}
              name = str(row.get("name", "") or "")
              room = str(room_map.get(name, "") or "")
              due = str(row.get("due", "") or "")
              should = bool(name and room and due and due <= today)
              return {"should_notify": should, "name": name, "room_id": room}
        outputs:
          should_notify: { type: boolean, children: null }
          name: { type: string, children: null }
          room_id: { type: string, children: null }
        variables:
        - value_selector: ['1783500000003', item]
          value_type: string
          variable: item_json
        - value_selector: ['1783500000001', room_map_json]
          value_type: string
          variable: room_map_json
        - value_selector: ['1783500000001', today]
          value_type: string
          variable: today
      parentId: '1783500000003'
      extent: parent
      position: { x: 100, y: 90 }
      positionAbsolute: { x: 700, y: 150 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left
      zIndex: 1002

    - id: '1783500000005'
      type: custom
      data:
        title: Notify?
        type: if-else
        isInIteration: true
        iteration_id: '1783500000003'
        logical_operator: and
        conditions:
        - variable_selector: ['1783500000004', should_notify]
          comparison_operator: is
          value: 'true'
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - variable_selector: ['1783500000004', should_notify]
            comparison_operator: is
            value: 'true'
      parentId: '1783500000003'
      extent: parent
      position: { x: 380, y: 90 }
      positionAbsolute: { x: 980, y: 150 }
      width: 241
      height: 100
      sourcePosition: right
      targetPosition: left
      zIndex: 1002

    - id: '1783500000006'
      type: custom
      data:
        title: Compose message (LLM)
        type: llm
        isInIteration: true
        iteration_id: '1783500000003'
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - id: 1783500000006-prompt-system
          role: system
          text: 'You write short, polite reminder messages. Output the message body only.'
        - id: 1783500000006-prompt-user
          role: user
          text: 'Write a one-sentence reminder for {{#1783500000004.name#}}.'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      parentId: '1783500000003'
      extent: parent
      position: { x: 660, y: 40 }
      positionAbsolute: { x: 1260, y: 100 }
      width: 241
      height: 100
      sourcePosition: right
      targetPosition: left
      zIndex: 1002

    - id: '1783500000007'
      type: custom
      data:
        title: Send to ChatWork
        type: http-request
        isInIteration: true
        iteration_id: '1783500000003'
        method: POST
        url: 'https://api.chatwork.com/v2/rooms/{{#1783500000004.room_id#}}/messages'
        authorization: { type: no-auth }
        headers: |
          X-ChatWorkToken: {{#env.CHATWORK_API_TOKEN#}}
        params: ''
        body:
          type: x-www-form-urlencoded
          data:
          - key: body
            type: text
            value: '{{#1783500000006.text#}}'
        timeout: { connect: 10, read: 30, write: 30 }
        ssl_verify: true
      parentId: '1783500000003'
      extent: parent
      position: { x: 940, y: 40 }
      positionAbsolute: { x: 1540, y: 100 }
      width: 241
      height: 100
      sourcePosition: right
      targetPosition: left
      zIndex: 1002

    - id: '1783500000008'
      type: custom
      data:
        title: Collect row results
        type: variable-aggregator
        isInIteration: true
        iteration_id: '1783500000003'
        output_type: string
        variables:
        - - '1783500000006'
          - text
        - - '1783500000004'
          - name
      parentId: '1783500000003'
      extent: parent
      position: { x: 1160, y: 90 }
      positionAbsolute: { x: 1760, y: 150 }
      width: 241
      height: 82
      sourcePosition: right
      targetPosition: left
      zIndex: 1002

    - id: '1783500000009'
      type: custom
      data:
        title: Output
        type: end
        outputs:
        - variable: results
          value_selector: ['1783500000003', output]
          value_type: 'array[string]'
      position: { x: 2100, y: 100 }
      positionAbsolute: { x: 2100, y: 100 }
      width: 241
      height: 100
      sourcePosition: right
      targetPosition: left

    viewport: { x: 0, y: 0, zoom: 0.5 }
