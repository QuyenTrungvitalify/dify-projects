app:
  description: 'Fixture: Python code field contains literal "{{#X.Y#}}" string.
    Per Q3.3, lenient default treats ALL such occurrences as Dify refs (because
    Dify itself parses them). So this fixture is expected to be flagged (exit 1).'
  icon: "\U0001F40D"
  icon_background: '#E1F0FF'
  icon_type: emoji
  mode: workflow
  name: 'Fixture: code_with_string_ref'
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: { enabled: false }
    opening_statement: ''
    retriever_resource: { enabled: true }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions: []
    suggested_questions_after_answer: { enabled: false }
    text_to_speech: { enabled: false, language: '', voice: '' }
  graph:
    edges: []
    nodes:
    - id: '1700000000001'
      type: custom
      data:
        title: 'Start'
        type: start
        variables:
        - variable: source_text
          type: paragraph
          required: true
    - id: '1700000000002'
      type: custom
      data:
        title: 'Code'
        type: code
        code_language: python3
        code: |
          def main(text: str) -> dict:
              # The string below LOOKS like a Dify ref but is just a Python literal.
              # Per Q3.3, the linter still flags it (Dify would also parse it).
              fake = "{{#7777777777777.fake_field#}}"
              return {"out": fake + text}
        outputs:
          out: { type: string, children: null }
        variables:
        - value_selector: ['1700000000001', source_text]
          value_type: string
          variable: text
    - id: '1700000000003'
      type: custom
      data:
        title: 'End'
        type: end
        outputs:
        - variable: result
          value_selector: ['1700000000002', out]
          value_type: string
    viewport: { x: 0, y: 0, zoom: 1.0 }
