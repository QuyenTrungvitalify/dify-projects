app:
  description: 'Fixture: multiple broken refs (3+ errors)'
  icon: "\U0001F4A5"
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 'Fixture: mixed_errors'
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: { enabled: false }
    opening_statement: ''
    retriever_resource: { enabled: true }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions: []
    suggested_questions_after_answer: { enabled: false }
    text_to_speech: { enabled: false, language: '', voice: '' }
  graph:
    edges: []
    nodes:
    - id: '1700000000001'
      type: custom
      data:
        title: 'Start'
        type: start
        variables:
        - variable: source_text
          type: paragraph
          required: true
    - id: '1700000000002'
      type: custom
      data:
        title: 'LLM'
        type: llm
        model: { provider: anthropic, name: claude, mode: chat }
        prompt_template:
        - role: system
          text: 'Bad-1: {{#9999999999999.text#}}'
        - role: user
          text: |
            Bad-2: {{#1700000000001.wrongfield#}}
            Bad-3: {{#1700000000002.no_such_field#}}
    - id: '1700000000003'
      type: custom
      data:
        title: 'End'
        type: end
        outputs:
        - variable: result
          value_selector: ['8888888888888', text]
          value_type: string
    viewport: { x: 0, y: 0, zoom: 1.0 }
