app:
  description: 'Fixture: iteration body refs to item / output'
  icon: "\U0001F501"
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 'Fixture: valid_iteration'
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: { enabled: false }
    opening_statement: ''
    retriever_resource: { enabled: true }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions: []
    suggested_questions_after_answer: { enabled: false }
    text_to_speech: { enabled: false, language: '', voice: '' }
  graph:
    edges:
    - source: '1700000000001'
      target: '1700000000002'
    - source: '1700000000002'
      target: '1700000000003'
    - source: '1700000000003'
      target: '1700000000005'
    - source: '1700000000005'
      target: '1700000000006'
    nodes:
    - id: '1700000000001'
      type: custom
      data:
        title: 'Start'
        type: start
        variables:
        - variable: items_input
          type: paragraph
          required: true
    - id: '1700000000002'
      type: custom
      data:
        title: 'Split'
        type: code
        code_language: python3
        code: 'def main(s): return {"items": s.split(",")}'
        outputs:
          items: { type: 'array[string]', children: null }
        variables:
        - value_selector: ['1700000000001', items_input]
          value_type: string
          variable: s
    - id: '1700000000003'
      type: custom
      data:
        title: 'Iterate'
        type: iteration
        iterator_selector: ['1700000000002', items]
        output_selector: ['1700000000004', result]
        output_type: 'array[string]'
        is_parallel: false
        parallel_nums: 1
        start_node_id: 1700000000003start
    - id: '1700000000004'
      type: custom
      parentId: '1700000000003'
      data:
        title: 'Process'
        type: code
        code_language: python3
        isInIteration: true
        iteration_id: '1700000000003'
        code: |
          def main(item: str) -> dict:
              return {"result": item.upper()}
        outputs:
          result: { type: string, children: null }
        variables:
        - value_selector: ['1700000000003', item]
          value_type: string
          variable: item
    - id: '1700000000005'
      type: custom
      data:
        title: 'Use Output'
        type: llm
        model: { provider: anthropic, name: claude, mode: chat }
        prompt_template:
        - role: user
          text: 'Results: {{#1700000000003.output#}}'
    - id: '1700000000006'
      type: custom
      data:
        title: 'End'
        type: end
        outputs:
        - variable: final
          value_selector: ['1700000000005', text]
          value_type: string
    viewport: { x: 0, y: 0, zoom: 1.0 }
